  --nf-brand-100: #DDE1F5;
  --nf-brand-200: #BCC3EC;
  --nf-brand-300: #8F99DA;
  --nf-brand-400: #5E6BC4;
  --nf-brand-500: #3A48B0;
  --nf-brand-600: rgb(41,54,155); 
  --nf-brand-700: #212C85; 
  --nf-brand-800: #18216A;
  --nf-brand-900: #0B1450; 
  --nf-brand-950: #00006D; 

  
  --nf-gold-50:  #FEF8EA;
  --nf-gold-100: #FDEFC9;
  --nf-gold-300: #F7D27F;
  --nf-gold-400: #F3BD47; 
  --nf-gold-500: #E0A42A;
  --nf-gold-700: #8A6212; 

  
  --nf-ink:        #0B1450; 
  --nf-ink-soft:   #3D4A6B; 
  --nf-ink-muted:  #5F6B85; 
  --nf-ink-faint:  #9AA3B8; 
  --nf-line:       #E3E6F0; 
  --nf-line-strong:#C9CEDF; 
  --nf-surface:    #F7F8FC; 
  --nf-surface-2:  #EFF1F8; 
  --nf-white:      #FFFFFF;

  
  --nf-success:    #1F7A4D;
  --nf-success-50: #E8F5EE;
  --nf-danger:     #B42318;
  --nf-danger-50:  #FEF0EE;
  --nf-warning:    #8A6212; 
  --nf-warning-50: #FEF8EA;

  
  --nf-font-sans: 'Vazirmatn', Tahoma, 'Segoe UI', system-ui, sans-serif;
  --nf-weight-regular: 400;
  --nf-weight-semibold: 600;
  --nf-weight-bold: 800; 
  
  --nf-text-display: 28px;   --nf-lh-display: 1.55; 
  --nf-text-display-lg: 40px;--nf-lh-display-lg: 1.45; 
  --nf-text-h2: 22px;        --nf-lh-h2: 1.6;       
  --nf-text-h2-lg: 30px;     --nf-lh-h2-lg: 1.5;
  --nf-text-h3: 18px;        --nf-lh-h3: 1.7;       
  --nf-text-h3-lg: 20px;
  --nf-text-body: 16px;      --nf-lh-body: 1.9;     
  --nf-text-article: 17px;   --nf-lh-article: 2;    
  --nf-text-small: 15px;     --nf-lh-small: 1.8;    
  --nf-text-caption: 14px;   --nf-lh-caption: 1.7;  
  --nf-text-num-lg: 24px;    

  
  --nf-space-1: 4px;
  --nf-space-2: 8px;
  --nf-space-3: 12px;
  --nf-space-4: 16px;
  --nf-space-5: 20px;  
  --nf-space-6: 24px;
  --nf-space-8: 32px;  
  --nf-space-10: 40px;
  --nf-space-12: 48px;
  --nf-space-14: 56px; 
  --nf-space-16: 64px;
  --nf-space-20: 80px;
  --nf-space-24: 96px; 
  --nf-container: 1120px;
  --nf-prose: 720px;
  --nf-gutter: 20px;          
  --nf-section-gap: 56px;     

  
  --nf-radius-sm: 10px;   
  --nf-radius-control: 14px; 
  --nf-radius-card: 20px; 
  --nf-radius-sheet: 28px;
  --nf-radius-pill: 999px;

  
  --nf-shadow-xs: 0 1px 2px rgba(11, 20, 80, .05);
  --nf-shadow-card: 0 1px 2px rgba(11, 20, 80, .04), 0 6px 20px -8px rgba(11, 20, 80, .12);
  --nf-shadow-raised: 0 2px 4px rgba(11, 20, 80, .04), 0 16px 36px -12px rgba(41, 54, 155, .30); 
  --nf-shadow-button: 0 1px 2px rgba(11, 20, 80, .10), 0 6px 14px -6px rgba(41, 54, 155, .45);
  --nf-shadow-pop: 0 16px 44px -10px rgba(11, 20, 80, .28);  
  --nf-shadow-bar: 0 -4px 20px -6px rgba(11, 20, 80, .14);  
  --nf-ring: 0 0 0 4px rgba(41, 54, 155, .22);              

  
  --nf-control-h: 52px;   
  --nf-control-h-min: 48px;
  --nf-control-h-sm: 44px;
  --nf-touch-min: 44px;
  --nf-option-h: 64px;    
  --nf-header-h: 64px;
  --nf-bottom-bar-h: 72px;
  --nf-progress-h: 6px;

  
  --nf-ease: cubic-bezier(.2, .7, .2, 1);
  --nf-dur-fast: 150ms;
  --nf-dur: 200ms;
}

@media (min-width: 1024px) {
  :root {
    --nf-gutter: 32px;
    --nf-section-gap: 96px;
  }
}

@media (prefers-reduced-motion: reduce) {
  :root { --nf-dur-fast: 0ms; --nf-dur: 0ms; }
}


:root {
  --nf-call-ok:     #1F7A4D; 
  --nf-call-ok-50:  #E8F5EE;
  --nf-call-na:     #4A5163; 
  --nf-call-na-50:  #F1F2F5;
  --nf-call-off:    #A3480B; 
  --nf-call-off-50: #FFF3EA;
  --nf-call-focus:  var(--nf-brand-600);
}


*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--nf-font-sans);font-size:16px;line-height:1.8;color:var(--nf-ink-soft);background:var(--nf-surface);
 --dock-h:84px;--dock-gap:16px;--top-h:64px}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:inherit;text-decoration:none}
h1,h2,h3,p,ul,ol{margin:0;padding:0}
ul,ol{list-style:none}
.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:none;box-shadow:var(--nf-ring)}
.demo{background:var(--nf-gold-50);color:var(--nf-gold-700);font-size:14px;font-weight:600;text-align:center;padding:6px 16px;border-bottom:1px solid var(--nf-gold-100)}
.demo .i{width:16px;height:16px;vertical-align:-3px;margin-inline-end:4px}
.smp{display:inline-block;font-size:14px;font-weight:600;color:var(--nf-gold-700);background:var(--nf-gold-50);border:1px dashed var(--nf-gold-300);border-radius:var(--nf-radius-pill);padding:0 8px;line-height:22px;margin-inline-start:6px}
.cid{display:inline-flex;align-items:center;min-height:26px;padding:0 8px;border-radius:8px;background:var(--nf-surface-2);color:var(--nf-ink-muted);font-size:14px;font-weight:600;margin-inline-start:8px;vertical-align:middle}
.ph{display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--nf-ink);font-size:15px;white-space:nowrap;vertical-align:middle}
.ph .phs{font-size:14px;font-weight:600;color:var(--nf-gold-700);background:var(--nf-gold-50);border:1px dashed var(--nf-gold-300);border-radius:var(--nf-radius-pill);padding:0 7px;margin-inline-start:6px;line-height:20px;display:inline-block}


.top{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--nf-line)}
.top-in{max-width:1240px;margin:0 auto;height:var(--top-h);display:flex;align-items:center;gap:16px;padding:0 32px}
.brand{display:flex;align-items:center;gap:10px;flex:none;min-height:44px;border-radius:12px}

.brand small{font-size:14px;color:var(--nf-ink-muted);font-weight:600;border-inline-start:1px solid var(--nf-line);padding-inline-start:10px}
.ttl{flex:1;min-width:0;display:flex;align-items:baseline;gap:12px}
.ttl h1{font-size:18px;font-weight:800;color:var(--nf-ink);white-space:nowrap}
.ttl p{font-size:14px;color:var(--nf-ink-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acts-top{display:flex;align-items:center;gap:6px;flex:none}
.ib{position:relative;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:var(--nf-ink-soft)}
.ib:hover{background:var(--nf-surface-2)}
.ib.wb{width:auto;min-width:44px;padding:0 8px;display:inline-flex;align-items:center;gap:6px}
.ib.wb .bdg{position:static;border:0}
.av{width:44px;height:44px;border-radius:50%;background:var(--nf-brand-100);color:var(--nf-brand-900);font-weight:800;display:grid;place-items:center;font-size:16px}
.me{display:flex;align-items:center;gap:8px;padding-inline-start:6px;border-radius:var(--nf-radius-pill);min-height:44px}
.me span.nm{font-size:14px;font-weight:600;color:var(--nf-ink-soft)}
.stx{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--nf-success);font-weight:600}
.stx::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--nf-success)}
.dndchip{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 12px;border-radius:var(--nf-radius-pill);background:var(--nf-brand-50);color:var(--nf-brand-900);font-size:14px;font-weight:600}
.dndchip .i{width:18px;height:18px}
.ast-top{display:none}


.pg{max-width:1240px;margin:0 auto;padding:24px 32px calc(var(--dock-h) + var(--dock-gap) + 32px)}
.card{background:#fff;border:1px solid var(--nf-line);border-radius:var(--nf-radius-card);box-shadow:var(--nf-shadow-card)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:var(--nf-radius-control);font-weight:600;font-size:15px;white-space:nowrap}
.btn .i{width:20px;height:20px}
.btn.pri{background:var(--nf-brand-600);color:#fff;box-shadow:var(--nf-shadow-button)}
.btn.ok{background:var(--nf-success);color:#fff}
.btn.gh{background:#fff;border:1px solid var(--nf-line-strong);color:var(--nf-ink)}
.btn.lk{color:var(--nf-brand-600);padding:0 10px}
.btn.gold{background:var(--nf-gold-400);color:var(--nf-ink)}
.btn.dash{border:1.5px dashed var(--nf-gold-500);color:var(--nf-gold-700);background:var(--nf-gold-50)}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:28px;padding:0 10px;border-radius:var(--nf-radius-sm);font-size:14px;font-weight:600;background:var(--nf-surface-2);color:var(--nf-ink-soft);white-space:nowrap}
.chip .i{width:16px;height:16px}
.chip.b{background:var(--nf-brand-50);color:var(--nf-brand-900)}
.chip.g{background:var(--nf-gold-50);color:var(--nf-gold-700)}
.chip.r{background:var(--nf-danger-50);color:var(--nf-danger)}
.chip.s{background:var(--nf-success-50);color:var(--nf-success)}
.note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:var(--nf-brand-50);color:var(--nf-brand-900);font-size:15px}
.note .i{margin-top:3px;width:18px;height:18px}
.hrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.hrow h2{font-size:20px;font-weight:800;color:var(--nf-ink)}
.hrow .sp{flex:1}
.muted{color:var(--nf-ink-muted);font-size:14px}


.prog{padding:16px 20px;margin-bottom:16px}
.prog .r1{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.prog b{font-size:20px;color:var(--nf-ink);font-weight:800}
.bar{height:6px;border-radius:99px;background:var(--nf-surface-2);margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--nf-brand-600);border-radius:99px}
.cur{padding:20px;border:1.5px solid var(--nf-brand-600)}
.c3{display:grid;grid-template-columns:1fr 1.5fr 1fr;gap:20px}
.col{min-width:0}
.col h3,.col>summary{font-size:15px;font-weight:800;color:var(--nf-ink);margin-bottom:10px;display:flex;gap:8px;align-items:center}
.col>summary{list-style:none;min-height:44px;margin:0;cursor:pointer}
.col>summary::-webkit-details-marker{display:none}
.calls li{padding:10px 0;border-bottom:1px solid var(--nf-line);font-size:14px}
.calls li:last-child{border:0}
.calls b{display:block;color:var(--nf-ink);font-size:14px}
.cm{border-inline:1px solid var(--nf-line);padding-inline:20px}
.cm .tg{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.nm2{font-size:24px;font-weight:800;color:var(--nf-ink);margin-bottom:6px}
.why{font-weight:600;color:var(--nf-ink);margin-bottom:12px}
.qbox{background:var(--nf-surface);border-radius:14px;padding:12px 14px;margin-bottom:12px;font-size:15px}
.qbox small{display:block;font-size:14px;color:var(--nf-ink-muted)}
.brow{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.brow .btn.ok{flex:1}
.lockln{margin-top:14px;padding-top:12px;border-top:1px dashed var(--nf-line);font-size:14px;color:var(--nf-ink-muted);display:flex;gap:6px;align-items:center}
.lockln .i{width:16px;height:16px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14px;margin-bottom:12px}
.kv dt{color:var(--nf-ink-muted)}
.kv dd{margin:0;color:var(--nf-ink);font-weight:600}
.nxt{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:14px;font-size:14px;color:var(--nf-ink-muted)}
.nxt b{color:var(--nf-ink)}


.srch{display:flex;align-items:center;gap:8px;min-height:48px;padding:0 14px;border:1px solid var(--nf-line-strong);border-radius:14px;background:#fff;flex:1;min-width:220px;max-width:420px}
.srch input{border:0;outline:0;flex:1;min-width:0;min-height:44px;font-size:16px;background:none}
.flt{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.fb{min-height:44px;padding:0 14px;border-radius:var(--nf-radius-pill);border:1px solid var(--nf-line-strong);background:#fff;font-size:14px;font-weight:600;color:var(--nf-ink-soft)}
.fb[aria-checked=true]{background:var(--nf-brand-900);border-color:var(--nf-brand-900);color:#fff}
.sab{padding:16px 18px;margin-bottom:16px;background:linear-gradient(180deg,var(--nf-gold-50),#fff 70%)}
.sab h3{font-size:16px;font-weight:800;color:var(--nf-ink);display:flex;gap:8px;align-items:center;margin-bottom:12px}
.sab h3 .i{color:var(--nf-gold-700)}
.sag{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.sac{background:#fff;border:1px solid var(--nf-line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.sac b{color:var(--nf-ink)}
.sac p{font-size:14px}
.sac .btn{align-self:flex-start;min-height:44px}
.tbl{overflow:hidden}
.tr{display:grid;grid-template-columns:2.1fr 1.5fr 1.2fr 1.3fr 1.7fr 1.5fr 56px;gap:12px;align-items:center;padding:10px 18px;border-bottom:1px solid var(--nf-line);font-size:14px}
.tr:last-child{border:0}
.tr.th{background:var(--nf-surface);font-weight:600;color:var(--nf-ink-muted);min-height:44px}
.tr .cn{font-weight:800;color:var(--nf-ink);font-size:15px;min-width:0}
.tr .go{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--nf-brand-600);background:var(--nf-brand-50)}
.lbl{display:none}


.seg{display:inline-flex;background:var(--nf-surface-2);border-radius:14px;padding:4px;gap:4px;margin-bottom:16px;flex-wrap:wrap}
.seg button{white-space:nowrap;flex:none;min-height:44px;padding:0 16px;border-radius:11px;font-size:14px;font-weight:600;color:var(--nf-ink-soft)}
.seg button[aria-selected=true]{background:#fff;color:var(--nf-ink);box-shadow:var(--nf-shadow-xs)}
.rgrp{margin-bottom:18px}
.rgrp h3{font-size:15px;font-weight:800;color:var(--nf-ink);margin:0 4px 8px;display:flex;gap:8px;align-items:center}

.mc-page{max-width:1240px}.mc-page>section,.mc-page>article{margin-bottom:16px}.mc-date{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--nf-ink-muted);margin-bottom:14px}
.mc-row{display:flex;align-items:center;flex-wrap:wrap;gap:8px}.fhd .mc-row{margin:8px 0}.mc-heading{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}.mc-heading h2,.mc-section>h2{font-size:20px;font-weight:800;color:var(--nf-ink)}
.mc-customer{display:inline-flex;align-items:center;gap:5px;flex-wrap:wrap}.mc-customer .cid{margin:0}.mc-customer b{font-size:16px;color:var(--nf-ink)}
.mc-caseid{display:inline-flex;align-items:center;gap:5px;font-size:15px;font-weight:700;color:var(--nf-brand-700)}
.mc-cases{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:12px}.mc-case{padding:20px;display:flex;flex-direction:column;align-items:flex-start;gap:10px}.mc-case h3{font-size:18px}.mc-case.new{border-inline-start:3px solid var(--nf-brand-600)}.mc-case.compact{background:var(--nf-surface-2);padding:14px;gap:6px}.mc-case .mc-row{width:100%}.mc-case .chip{white-space:normal}
.mc-muted{font-size:14px;color:var(--nf-ink-muted)}.mc-filter{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:18px}.mc-success{display:flex;gap:8px;align-items:center;padding:14px;border-radius:14px;background:var(--nf-success-50);color:var(--nf-success);margin-bottom:16px}
.mc-wizard{display:grid;grid-template-columns:250px minmax(0,1fr);gap:20px;align-items:start}.mc-rail{padding:20px}.mc-rail h3{margin-bottom:18px;font-size:16px}.mc-rail p{display:flex;gap:8px;align-items:center;min-height:48px;font-size:14px;color:var(--nf-ink-muted);padding:6px;border-radius:10px}.mc-rail p.cur{background:var(--nf-brand-50);color:var(--nf-brand-700);font-weight:800}.mc-rail p b{display:grid;place-items:center;min-width:26px;height:26px;border:1px solid var(--nf-line);border-radius:50%;font-size:12px}.mc-rail .i{width:16px;height:16px}
.mc-wbody{padding:28px;display:flex;flex-direction:column;gap:18px;min-width:0}.mc-wbody h2,.mc-picker h2{font-size:22px;font-weight:800;color:var(--nf-ink)}.mc-wbody h3{font-size:16px}.mc-wbody>.btn{align-self:flex-start}.mc-progress{display:flex;gap:4px}.mc-progress i{height:5px;flex:1;background:var(--nf-line);border-radius:5px}.mc-progress i.on{background:var(--nf-brand-600)}.mc-check{display:flex;gap:8px;font-size:14px;align-items:center}
.mc-choice{display:grid;gap:10px}.mc-choice button{padding:16px;min-height:64px;display:flex;flex-direction:column;align-items:flex-start;text-align:right;border:1.5px solid var(--nf-line-strong);border-radius:14px;gap:6px;color:var(--nf-ink);background:#fff;font-size:15px}.mc-choice button[aria-checked=true]{border-color:var(--nf-brand-600);background:var(--nf-brand-50);box-shadow:0 0 0 1px var(--nf-brand-600)}.mc-choice button[aria-checked=true] b:before{content:'◉';margin-inline-end:8px;color:var(--nf-brand-600)}.mc-choice button span{font-size:14px;color:var(--nf-ink-muted)}
.mc-review{background:var(--nf-surface-2);padding:18px;border-radius:14px}.mc-review dl{display:grid;grid-template-columns:150px 1fr;gap:14px;font-size:15px}.mc-review dt{color:var(--nf-ink-muted)}.mc-review dd{color:var(--nf-ink);font-weight:700}
.mc-picker{max-width:720px;margin-inline:auto;padding:24px;display:flex;flex-direction:column;gap:18px}.mc-eyebrow{font-size:14px;color:var(--nf-ink-muted)}.mc-field{display:flex;flex-direction:column;gap:8px;font-weight:700;font-size:15px}.mc-field input{width:100%;min-height:48px;border:1px solid var(--nf-line-strong);border-radius:12px;padding:10px;background:#fff;color:var(--nf-ink);font-family:inherit}.mc-warning{background:var(--nf-gold-50);border:1px solid var(--nf-gold-300);padding:12px;border-radius:12px;font-size:14px}
.mc-call{padding:16px;background:var(--nf-brand-50);border:1px solid var(--nf-brand-100);border-radius:14px;display:flex;flex-direction:column;gap:8px}.mc-call small{color:var(--nf-ink-muted)}.mc-call .btn{align-self:flex-start}.mc-lock,.mc-log{padding:20px;display:flex;flex-direction:column;gap:12px}.mc-log{border:1px solid var(--nf-line);border-radius:14px;background:#fff;font-size:14px}.mc-draft{color:var(--nf-gold-700);font-size:13px;display:block;margin-bottom:6px}
button:disabled{background:var(--nf-surface-2);color:var(--nf-ink-muted);box-shadow:none;cursor:not-allowed}.fchat .ta3{min-height:70px}.fchat .snd{min-width:44px;min-height:44px}.mc-notes-toggle{display:none}.fmain{min-width:0}
@media(min-width:1024px){.dock{left:auto;right:20px;transform:none;max-width:calc(100% - 410px)}}
@media(max-width:1023.98px){.mc-wizard{grid-template-columns:1fr}.mc-rail{display:none}.mc-notes-toggle{display:flex}.mc-notes .fchat{display:flex;position:static;height:540px;min-height:420px}.mc-cases{grid-template-columns:1fr}.mc-review dl{grid-template-columns:1fr;gap:6px}.mc-review dd{margin-bottom:10px}.mc-wbody,.mc-picker{padding:16px}.mc-wbody h2,.mc-picker h2{font-size:20px}.mc-row .btn{flex:1 1 auto}.mc-heading{flex-wrap:wrap}.mc-choice button{padding:12px}.mc-success{align-items:flex-start}.mc-success .i{flex:none}.mc-case .mc-row .btn{width:100%}.mc-call .btn,.mc-lock .btn{white-space:normal;text-align:center}.mc-lock{padding:16px}.mc-customer b{font-size:15px}.mc-page .fhd h2{font-size:22px}}

.mc-case h3,.mc-choice b{overflow-wrap:anywhere}
.mc-call p,.mc-lock p{overflow-wrap:anywhere}
.fhd .chip{white-space:normal;max-width:100%;line-height:1.8}

<script>/* file-detail v1.0: صفحه‌ی جزئیات پرونده‌ی تسهیلات (از «پرونده‌های من»). ماکاپ طراحی، داده‌ها نمونه.
   «چت» این صفحه همان «یادداشت‌های پرونده» است: فقط داخلی و بین همکاران؛ به مشتری و بله نمی‌رود.
   جای ثابت: در دسکتاپ ستون کنار صفحه با ارتفاع خودش و کادر نوشتن پایین ستون؛ در موبایل زبانه‌ی «یادداشت‌ها» که تمام‌صفحه باز می‌شود.
   پوسته‌ی عمومی CRM (داک پایین، دستیار محدثه، «داخلی»، «پیام‌رسان‌ها»، «گزارش خطا») هرگز روی این ستون نمی‌افتد. */
const Q = new URLSearchParams(location.search);
const REVIEW = Q.get('review') === '1', SHOT = !!Q.get('shot');
const SCENES='customer_multiple files_multiple second_case_start wizard_plan wizard_review second_case_created call_case_picker file_call_active reminder_case_picker general_customer_call support_restricted'.split(' ');
window.__SCENES=SCENES;
const SC=SCENES.includes(Q.get('sc'))?Q.get('sc'):'customer_multiple';
const SUPPORT=SC==='support_restricted';
const ELIG=Q.get('elig')||'assigned';
const OTHER=Q.get('role')==='other';
const ACTIVE=SC==='file_call_active', PENDING=Q.get('status')==='pending';
/* ارتفاع ستون یادداشت‌ها از ارتفاع پنجره؛ در عکس‌برداری همان ارتفاع اول نگه داشته می‌شود */
const setVh = () => document.documentElement.style.setProperty('--vh', innerHeight + 'px');
setVh(); if (!SHOT) addEventListener('resize', setVh);
const I = (id, c = '') => `<svg class="i ${c}" aria-hidden="true"><use href="#${id}"/></svg>`;
const FD = '۰۱۲۳۴۵۶۷۸۹';
const fa = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, '٬').replace(/[0-9]/g, d => FD[d]);
const fd = v => String(v).replace(/[0-9]/g, d => FD[d]);
const rv = h => REVIEW ? h + (h.includes('?') ? '&' : '?') + 'review=1' : h;
const go = sc => rv('?sc=' + sc);
const SMP = '<span class="smp">نمونه</span>';
const cid = id => `<button class="cid" type="button" aria-label="شناسه‌ی ${fd(id)}، کپی" data-cid="${id}">#${fd(id)}</button>`;
const tel = nn => '091200000' + String(nn).padStart(2, '0');
const ph = (nn, big) => { if (Q.get('live')==='1' && C.phone) { const raw=String(C.phone); const f=fd(raw); return `<span class="ph${big ? ' big' : ''}"><a class="phn" data-tel="${raw}" dir="ltr">${f}</a><button class="phc" type="button" aria-label="کپی شماره‌ی ${f}" data-copy="${raw}">${I('i-copy')}${big ? '<span>کپی</span>' : ''}</button></span>`; } const f = fd(tel(nn)); return `<span class="ph${big ? ' big' : ''}"><a class="phn" data-tel="${tel(nn)}" dir="ltr">${f}</a><span class="phs">نمونه</span><button class="phc" type="button" aria-label="کپی شماره‌ی ${f}" data-copy="${tel(nn)}">${I('i-copy')}${big ? '<span>کپی</span>' : ''}</button></span>`; };

/* ---------- بارگذاری: سقف حجم و فرمت‌ها از تنظیمات سرور؛ امروز ۱۰ مگابایت و همه‌ی فرمت‌ها ---------- */
const UPL = { maxMB: 10, types: SC === 'up_fmt' ? 'PDF، JPG و PNG' : '' };

/* ---------- آدم‌ها (نمونه) ---------- */
const ME=SUPPORT?{n:'خانم تاجیک',a:'ت',r:'ثبت‌نام و پشتیبانی'}:{n:'آقای کاظمی',a:'ک',r:'کارشناس فروش'};
const REG = { n: 'خانم امینی', a: 'ا', r: 'کارشناس ثبت', c: 'c1' };
const MGR = { n: 'احمد', a: 'ا', r: 'مدیر فروش', c: 'c4' };
const MGR_AU = 'مدیر فروش: احمد';

/* ---------- پرونده‌ها (نمونه؛ برچسب‌ها از کد فعلی) ---------- */
const STEPS = ['قرارداد اولیه و امضا', 'مدارک مشتری', 'تصویب مبلغ وام', 'قرارداد جایگزین (در صورت تغییر مبلغ)', 'وثیقه', 'تصمیم نهایی تأمین‌کننده', 'مدارک فیزیکی', 'شارژ و تأیید مدیریت', 'خاتمه'];
const F = {
  214: { id: 214, c: { n: 'سمیرا نادری', id: 4172, nn: 21 }, plan: 'لندتک / بانک منتخب — نمونه ۱', req: 250000000, appr: 0, inst: 18, step: 2, stage: 'بارگذاری مدارک مشتری', reg: 'شنبه ۲ آبان ۱۴۰۵',
    biz: 'در انتظار اقدام کارشناس فروش', turn: 'me', docs: 1 },
  98: { id: 98, c: { n: 'بهرام صالحی', id: 3058, nn: 47 }, plan: 'لندتک / بانک منتخب — نمونه ۲ (بازنشسته‌ها)', req: 200000000, appr: 160000000, inst: 18, step: 4, stage: 'امضای قرارداد جایگزین توسط مشتری', reg: 'دوشنبه ۱۳ مهر ۱۴۰۵',
    biz: 'در انتظار امضای قرارداد توسط مشتری', turn: 'مشتری', docs: 0 },
};
const SIGN = SC.startsWith('sign_');            // ارسال دوباره‌ی لینک امضا (پرونده‌ی ۹۸)
const FID = SC.endsWith('98') || SIGN ? 98 : 214;
const FL = F[FID];
const CLOSED = SC === 'closed';
const SENDV = SC.startsWith('send');           // هر دو مدرک بارگذاری شده
const DONE = SC === 'send_done';
if (DONE) Object.assign(FL, { biz: 'در انتظار اقدام کارشناس ثبت', turn: 'کارشناس ثبت', stage: 'بررسی مدارک مشتری' });
if (CLOSED) Object.assign(FL, { biz: 'لغو شده', turn: 'closed' });
const turnChip = () => FL.turn === 'me' ? `<span class="chip g">${I('i-bolt')}اقدام با شماست</span>` : FL.turn === 'closed' ? `<span class="chip">${I('i-lock')}پرونده بسته شده</span>` : `<span class="chip">نوبت اقدام: ${FL.turn}</span>`;

/* ---------- زبانه‌ها و حالت‌ها ---------- */
const TAB = ['docs', 'closed', 'dnd'].includes(SC) || SC.startsWith('up') ? 'docs' : SC.startsWith('contract') || SIGN ? 'contract' : SC === 'history' ? 'hist' : 'ov';
const MOBCHAT = SC.startsWith('chat');            // در موبایل یادداشت‌ها تمام‌صفحه
const MODAL = SC.startsWith('up') || SC === 'dnd' || SC === 'send_1' || SC === 'send_2' || SC === 'sign_resend';
const DND = SC === 'dnd';

/* ---------- پوسته‌ی عمومی CRM (همان آیتم‌های داک فعلی) ---------- */
const NAV = { today: ['i-today', 'امروز'], cust: ['i-users', 'مشتریان'], files: ['i-file', 'پرونده‌ها'], rem: ['i-bell', 'یادآورها'], msg: ['i-send', 'پیام‌رسان‌ها'], team: ['i-chat', 'داخلی'], ast: ['i-bot', 'دستیار'], more: ['i-grid', 'بیشتر'] };
const dkItem = k => `<li><a class="dk-i" href="#${k}" aria-label="${NAV[k][1]}"${k === 'files' ? ' aria-current="page"' : ''}${k === 'ast' && SC === 'ast' ? ' aria-expanded="true"' : ''}><span class="dk-ic">${I(NAV[k][0])}</span><span class="dk-lb" aria-hidden="true">${NAV[k][1]}</span><span class="dk-tip" aria-hidden="true">${NAV[k][1]}</span></a></li>`;
const dock = () => `<nav class="dock" aria-label="بخش‌های اصلی"><ul class="dk-g">${['today', 'cust', 'files', 'rem'].map(dkItem).join('')}</ul><a class="dk-p" href="#new"><span class="pi">${I('i-plus')}</span>الان مشتری جدید دارم</a><ul class="dk-g">${['msg', 'team', 'ast', 'more'].map(dkItem).join('')}</ul></nav>`;
const tabbar = () => `<nav class="tb" aria-label="بخش‌های اصلی">${[['today'], ['cust'], ['new', 'i-plus', 'مشتری جدید'], ['files'], ['more']].map(([k, ic, t]) => `<a class="tb-i" href="#${k}" aria-label="${t || NAV[k][1]}"${k === 'files' ? ' aria-current="page"' : ''}><span class="tb-ic">${I(ic || NAV[k][0])}</span><span aria-hidden="true">${t || NAV[k][1]}</span></a>`).join('')}</nav>`;
const topBar = () => `<header class="top"><div class="top-in">
 <a class="brand" href="#home" aria-label="گروه مالی نفیس، پنل کارشناس"><span class="logo" aria-hidden="true"></span><small>پنل کارشناس</small></a>
 <div class="ttl"><h1>${SC==='files_multiple'?'پرونده‌های تسهیلات':SC.includes('wizard')||SC==='second_case_start'?'ثبت درخواست تسهیلات':'پرونده‌ی مشتری'}</h1><p>پنل مشتریان</p></div>
 <div class="acts-top"><button class="ib tdg" type="button" aria-label="گزارش خطا">${I('i-flag')}</button>${DND ? `<button class="dndchip" type="button" aria-label="مزاحم نشو روشن است تا وقتی فرم باز است؛ برای خاموش کردن بزن">${I('i-moon')}<span class="dl">مزاحم نشو</span></button>` : ''}<button class="me" type="button" aria-label="${ME.n}، ${ME.r}: حساب کاربری" aria-haspopup="menu"><span class="nm">${ME.n}</span><span class="av">${ME.a}</span></button></div>
</div></header>`;
/* «گزارش خطا» سراسری: در دسکتاپ دکمه‌ی شناور کنار داک، بیرون ستون یادداشت‌ها؛ در موبایل دکمه‌ی نوار بالا (هیچ دکمه‌ی شناوری روی محتوا نیست) */
const diag = () => `<button class="diag" type="button" aria-label="گزارش خطا">${I('i-flag')}<span>گزارش خطا</span></button>`;

/* ---------- سربرگ پرونده ---------- */
const head = () => `<section class="card fhd" aria-label="سربرگ پرونده">
 <nav class="crumb" aria-label="مسیر"><a href="#files">${I('i-back')}پرونده‌های من</a></nav>
 <div class="fhd-r1"><div class="who"><span class="eyb">پرونده‌ی تسهیلات ${fd(FL.id)}، ${FL.plan}</span>
  <div class="nmr"><h2>${FL.c.n}</h2>${cid(FL.c.id)}${SMP}</div>${ph(FL.c.nn, 1)}</div>
  <div class="fhd-act"><a class="btn gh sm" href="#cust">${I('i-user')}پرونده‌ی مشتری</a><button class="ib wb" type="button" aria-label="کارهای بیشتر: ثبت هوشمند با سارینا، لغو پرونده" aria-haspopup="menu">${I('i-more')}</button></div></div>
 <div class="fhd-chips"><span class="chip b">${FL.biz}</span>${turnChip()}<span class="chip">${I('i-user')}کارشناس فروش: ${ME.n} (شما)</span><span class="chip">${I('i-cal')}ثبت: ${FL.reg}</span></div>
 ${path()}
</section>`;

/* مسیر پرونده: نوار فشرده؛ «همه‌ی مراحل» فهرست کامل را باز می‌کند */
const STEPDATE = { 214: ['یکشنبه ۳ آبان'], 98: ['چهارشنبه ۱۵ مهر', 'سه‌شنبه ۲۱ مهر', 'دوشنبه ۴ آبان'] };
const path = () => {
  const s = FL.step, n = STEPS.length, open = SC === 'steps';
  const seg = STEPS.map((l, i) => `<i class="${i + 1 < s ? 'dn' : i + 1 === s ? 'now' : ''}"></i>`).join('');
  const list = open ? `<ol class="pl-list">${STEPS.map((l, i) => { const k = i + 1, st = k < s ? 'dn' : k === s ? 'now' : '';
    return `<li class="${st}"${st === 'now' ? ' aria-current="step"' : ''}><b>${st === 'dn' ? I('i-check') : fd(k)}</b><span class="l">${l}</span><span class="m">${st === 'dn' ? (STEPDATE[FID][i] || '') : st === 'now' ? (FL.turn === 'me' ? 'الان: اقدام با شماست' : 'الان: نوبت اقدام: ' + FL.turn) : ''}</span></li>`; }).join('')}</ol>` : '';
  return `<div class="path${open ? ' open' : ''}"><div class="pl-r"><span class="pl-t">مسیر پرونده</span><span class="pl-n">مرحله‌ی ${fd(s)} از ${fd(n)}: <b>${FL.stage}</b></span>
  <a class="btn lk sm" href="${go(open ? 'ov' : 'steps')}" aria-expanded="${open}">${open ? 'بستن' : 'همه‌ی مراحل'}${I('i-down', open ? 'up' : '')}</a></div>
  <div class="pl-bar" aria-hidden="true">${seg}</div>${list}</div>`; };

/* ---------- یادداشت‌های پرونده = چت داخلی همکاران (بدون حالت تحویل به مشتری) ---------- */
const STATUS = { sending: ['i-refresh', 'در حال ثبت'], sent: ['i-check', 'ثبت شد'], failed: ['i-alert', 'ثبت نشد'] };
const meta = o => { const p = [`<span>${o.tm}</span>`]; if (o.out && o.st) { const [ic, t] = STATUS[o.st]; p.push(`<span class="st ${o.st}">${I(ic)}${t}</span>`); }
  if (o.st === 'failed') p.push(`<button class="btn gh sm rty" type="button">${I('i-refresh')}ارسال دوباره</button>`); return `<span class="meta">${p.join('')}</span>`; };
const msg = (o, inner) => `<div class="msg ${o.out ? 'out' : 'in'}${o.st === 'failed' ? ' failed' : ''}${o.mg ? ' mg' : ''}"${o.st ? ` data-st="${o.st}"` : ''}><div class="bb">${o.mg ? `<span class="au">${I('i-user')}${MGR_AU}</span>` : o.by ? `<span class="by">${o.by}</span>` : ''}${inner}</div>${meta(o)}</div>`;
const T = (o, t) => msg(o, t);
const fileM = (o, name, sz) => msg(o, `<div class="frow"><span class="fi">${I('i-file')}</span><span class="tx"><b>${name}</b><span>${sz}</span></span><a class="ib" href="#dl" aria-label="دانلود ${name}">${I('i-dl')}</a></div>`);
const WV = [6, 12, 18, 10, 22, 14, 8, 16, 24, 12, 7, 18, 13, 20, 9, 15, 11, 6, 14, 19, 10, 8];

const support=()=>`<section class="card mc-picker"><span class="chip b">پشتیبانی، داخلی ۲۲۰</span><h2>نمای ثبت‌نام</h2>${who()}<p>کارشناس: آقای کاظمی (فقط برای اطلاع)</p><p>${ELIG==='registered'?'ثبت‌نام با خودت':ELIG==='assigned'?'پرونده‌ی ثبت‌نام اکنون با شماست':ELIG==='callback'?'تماس ورودی؛ مهلت پاسخ معتبر است':'مشتری شما نیست'}</p>${ELIG==='denied'?'<p class="mc-muted">شماره نمایش داده نمی‌شود</p>':ph(C.nn)}<div class="mc-row">${ELIG==='denied'?'':'<button class="btn pri">تماس</button>'}<a class="btn gh">باز کردن پرونده (نمای ثبت‌نام)</a></div><span class="chip">فقط‌خواندنی</span></section>`;
const forbidden=()=>`<section class="card mc-picker"><span class="chip">مشتری کارشناس دیگر</span><h2>این مشتری در دسترس شما نیست</h2><p>کارشناس: خانم حسنی</p></section>`;
const page=()=>OTHER?forbidden():SC==='customer_multiple'?customerHead()+casesSection():SC==='files_multiple'?listView():['second_case_start','wizard_plan','wizard_review'].includes(SC)?wizard():SC==='second_case_created'?created():SC==='call_case_picker'?picker():SC==='reminder_case_picker'?picker(true):SC==='file_call_active'?active():SC==='general_customer_call'?general():support();
document.title='چند پرونده‌ی همزمان | نفیس';
const EMBED=Q.get('embed')==='1';
document.body.innerHTML+=EMBED?`<main class="pg fpg mc-page">${page()}</main>`:`${REVIEW?'<p class="demo">ماکاپ طراحی؛ داده‌ی نمونه؛ هیچ درخواستی ثبت یا تماسی گرفته نمی‌شود</p>':''}${topBar()}<main class="pg fpg mc-page"><p class="mc-date">پنجشنبه ۷ آبان ۱۴۰۵ ${SMP}</p>${page()}</main>${dock()}${tabbar()}`;
const draftKey='mc-note-4172-case'+AF.id,ta=document.querySelector('#cmsg');
if(ta&&sessionStorage.getItem(draftKey)!==null)ta.value=sessionStorage.getItem(draftKey);
ta?.addEventListener('input',()=>sessionStorage.setItem(draftKey,ta.value));
document.addEventListener('click',async e=>{const c=e.target.closest('[data-copy],[data-cid]');if(c){try{await navigator.clipboard.writeText(c.dataset.copy||'#'+c.dataset.cid)}catch{}}
const s=e.target.closest('[data-assoc]');if(s){document.querySelectorAll('[data-assoc]').forEach(x=>x.setAttribute('aria-checked',String(x===s)));const a=document.querySelector('[data-start]');if(a)a.href=goScene(s.dataset.assoc==='general'?'general_customer_call':'file_call_active')+(s.dataset.assoc==='general'?'':'&case='+s.dataset.assoc);}
if(e.target.closest('[data-notes]'))document.body.classList.toggle('mc-notes');
if(e.target.closest('[data-local-save]')){e.target.textContent='یادآور ثبت شد (نمونه)';}
if(e.target.closest('.snd')&&ta?.value){document.querySelector('.cmsgs').insertAdjacentHTML('beforeend',T({out:1,st:'sent',tm:'۱۱:۳۵'},ta.value.replace(/[<>&]/g,'')));ta.value='';sessionStorage.setItem(draftKey,'');document.querySelector('.mc-draft')?.remove();}
});

if(window.parent&&window.parent!==window){
 document.addEventListener('click',e=>{
  const start=e.target.closest('[data-start],a.btn');
  const save=e.target.closest('[data-local-save]');
  if(save){const assoc=document.querySelector('[data-assoc][aria-checked="true"]');const fields=[...document.querySelectorAll('.mc-field input')].map(i=>i.value);parent.postMessage({type:'mc-reminder',assoc:assoc&&assoc.dataset.assoc,subject:fields[0]||'',when:fields[1]||''},'*');}
  if(start&&start.hasAttribute('data-start')){e.preventDefault();const assoc=document.querySelector('[data-assoc][aria-checked="true"]');parent.postMessage({type:'mc-choice',assoc:assoc&&assoc.dataset.assoc,href:start.getAttribute('href')},'*');}
 },true);
}

if(window.parent&&window.parent!==window){
 document.addEventListener('click',e=>{
  const save=e.target.closest('[data-local-save]');
  if(save){const assoc=document.querySelector('[data-assoc][aria-checked="true"]');const fields=[...document.querySelectorAll('.mc-field input')].map(i=>i.value);parent.postMessage({type:'mc-reminder',assoc:assoc&&assoc.dataset.assoc,subject:fields[0]||'',when:fields[1]||''},'*');return;}
  const a=e.target.closest('a[href]');
  if(!a)return;
  const href=a.getAttribute('href')||'';
  if(!href.startsWith('?')&&!href.includes('sc='))return;
  e.preventDefault();
  const assoc=document.querySelector('[data-assoc][aria-checked="true"]');
  parent.postMessage({type:'mc-nav',href,assoc:assoc&&assoc.dataset.assoc},'*');
 },true);
}
</script>
</body></html>
