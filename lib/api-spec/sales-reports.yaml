paths:
  report:
    get:
      operationId: getSalesReport
      tags: [crm]
      parameters:
        - {name: period, in: query, schema: {type: string, enum: [day, week, month, quarter, custom]}}
        - {name: anchor, in: query, schema: {type: string}}
        - {name: from, in: query, schema: {type: string}}
        - {name: to, in: query, schema: {type: string}}
        - {name: granularity, in: query, schema: {type: string, enum: [day, week, month]}}
        - {name: salespersonId, in: query, schema: {type: integer}}
      responses:
        '200':
          description: Scoped read-only sales conversion report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesReport'
        '400': {description: Invalid date range or filter}
        '401': {description: Authentication required}
        '403': {description: Report access denied}
components:
  schemas:
    SalesReportMetric:
      type: object
      required: [leads, contacted, answered, unanswered, unknownOutcome, requesters, caseCustomers, requests, cases, requestedAmount, contactRate, noAnswerRate, requestRate, caseRate, requestShare, contactedRequesters, contactedCaseCustomers, contactedRequestRate]
      properties:
        leads: {type: integer}
        contacted: {type: integer}
        answered: {type: integer}
        unanswered: {type: integer}
        unknownOutcome: {type: integer}
        requesters: {type: integer}
        caseCustomers: {type: integer}
        requests: {type: integer}
        cases: {type: integer}
        requestedAmount: {type: string}
        contactedRequesters: {type: integer}
        contactedCaseCustomers: {type: integer}
        contactedRequestRate: {type: [number, 'null']}
        contactRate: {type: [number, 'null']}
        noAnswerRate: {type: [number, 'null']}
        requestRate: {type: [number, 'null']}
        caseRate: {type: [number, 'null']}
        requestShare: {type: [number, 'null']}
    SalesReportCohort:
      allOf:
        - $ref: '#/components/schemas/SalesReportMetric'
        - type: object
          required: [key, label]
          properties:
            key: {type: string}
            label: {type: string}
    SalesReportPoint:
      allOf:
        - $ref: '#/components/schemas/SalesReportMetric'
        - type: object
          required: [date, to, newRequesters, previousRequesters]
          properties:
            date: {type: string}
            to: {type: string}
            newRequesters: {type: integer}
            previousRequesters: {type: integer}
    SalesReport:
      type: object
      required: [range, scope, salespeople, summary, cohorts, monthly, trend, definitions]
      properties:
        range:
          type: object
          required: [period, from, to, granularity, timezone]
          properties:
            period: {type: string}
            from: {type: string}
            to: {type: string}
            granularity: {type: string}
            timezone: {type: string}
        scope:
          type: object
          required: [salespersonId, canSelectSalesperson]
          properties:
            salespersonId: {type: [integer, 'null']}
            canSelectSalesperson: {type: boolean}
        salespeople:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id: {type: integer}
              name: {type: string}
        summary: {$ref: '#/components/schemas/SalesReportMetric'}
        cohorts:
          type: array
          items: {$ref: '#/components/schemas/SalesReportCohort'}
        monthly:
          type: object
          required: [from, to, current, previous]
          properties:
            from: {type: string}
            to: {type: string}
            current: {$ref: '#/components/schemas/SalesReportMetric'}
            previous: {$ref: '#/components/schemas/SalesReportMetric'}
        trend:
          type: array
          items: {$ref: '#/components/schemas/SalesReportPoint'}
        definitions:
          type: array
          items: {type: string}
