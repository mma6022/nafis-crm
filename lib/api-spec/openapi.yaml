    post:
      operationId: verifyLoanApplicationGeneratedDocumentSignature
      summary: Refresh signature status and continue eligible workflow
      description: Fetches a fresh Emzame signature-status observation. If the provider reports a positive signature for the current pending case, the server continues the eligible workflow and reports any actual stage transition in workflowAdvanced and nextStage. Signature verification does not run financial, PDF, or unit checks. The signed value indicates provider-reported completion only, not financial approval.
      tags: [loan-applications]
      parameters:
        [
          { $ref: "#/components/parameters/GenericId" },
          { $ref: "#/components/parameters/DocumentId" },
        ]
      responses:
        {
          "200":
            {
              description: Fresh provider-reported signature status and any eligible workflow continuation,
              content:
