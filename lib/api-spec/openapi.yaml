openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: crm
    description: CRM operations
paths:
  /auth/login:
    post:
      operationId: login
      tags: [crm]
      summary: Sign in with a CRM username and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthLoginInput"
      responses:
        "200":
          description: Authenticated CRM session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
        "401": { description: Invalid credentials }
  /auth/logout:
    post:
      operationId: logout
      tags: [crm]
      summary: End the current CRM session
      responses:
        "204": { description: Session ended }
  /auth/session:
    get:
      operationId: getAuthSession
      tags: [crm]
      summary: Get the current CRM session
      responses:
        "200":
          description: Current authenticated session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
        "401": { description: Not authenticated }
  /auth/profile:
    patch:
      operationId: updateAuthProfile
      tags: [crm]
      summary: Update the current user's editable profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthProfileUpdate"
      responses:
        "200":
          description: Updated current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
        "401": { description: Not authenticated }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /crm/summary:
    get:
      operationId: getCrmSummary
      tags: [crm]
      summary: Get CRM dashboard summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CrmSummary"
  /notification-settings:
    get:
      operationId: getNotificationSettings
      tags: [crm]
      summary: Get admin notification settings
      responses:
        "200":
          description: Notification settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationSettings" }
    patch:
      operationId: updateNotificationSettings
      tags: [crm]
      summary: Update admin notification settings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationSettingsInput" }
      responses:
        "200":
          description: Updated notification settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationSettings" }
  /notification-deliveries:
    get:
      operationId: listNotificationDeliveries
      tags: [crm]
      summary: List recent notification delivery results for admins
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Recent notification delivery results
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/NotificationDelivery" }
  /database-backup:
    get:
      operationId: downloadDatabaseBackup
      tags: [crm]
      summary: Download a consistent SQLite database backup (admin only)
      responses:
        "200":
          description: SQLite backup file
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "403": { description: Admin access required }
  /database-restore:
    post:
      operationId: restoreDatabaseBackup
      tags: [crm]
      summary: Validate and stage a replacement SQLite database (admin only)
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "202":
          description: Database accepted and restart scheduled
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: { type: string }
        "400": { description: Invalid CRM database }
        "403": { description: Admin access required }
  /consult-options:
    get:
      operationId: listConsultOptions
      tags: [crm]
      summary: List active CRM dictionary options
      parameters:
        - name: fieldKey
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Active dictionary options
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ConsultOption" }
  /customers:
    get:
      operationId: listCustomers
      tags: [crm]
      summary: List customers
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: customerId
          in: query
          description: Exact customer database identifier
          schema:
            type: integer
            minimum: 1
        - name: status
          in: query
          schema:
            type: string
            enum: [in_progress, cancelled, completed]
        - name: priority
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 3
        - name: hasPriority
          in: query
          schema:
            type: boolean
        - name: salespersonId
          in: query
          schema:
            type: integer
        - name: dateFrom
          in: query
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
        - name: dateTo
          in: query
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
        - name: minCallCount
          in: query
          schema:
            type: integer
            minimum: 0
        - name: maxCallCount
          in: query
          schema:
            type: integer
            minimum: 0
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Customer page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerPage"
    post:
      operationId: createCustomer
      tags: [crm]
      summary: Create a customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerInput"
      responses:
        "201":
          description: Created customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
  /customers/parse-text:
    post:
      operationId: parseCustomerText
      tags: [crm]
      summary: Extract customer fields from pasted free text
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerTextParseInput"
      responses:
        "200":
          description: Extracted customer fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerTextParseResult"
  /customers/{id}:
    get:
      operationId: getCustomer
      tags: [crm]
      summary: Get customer details
      parameters:
        - $ref: "#/components/parameters/CustomerId"
      responses:
        "200":
          description: Customer details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerDetail"
        "404":
          description: Customer not found
    delete:
      operationId: deleteCustomer
      tags: [crm]
      summary: Permanently delete a customer and related records
      parameters:
        - $ref: "#/components/parameters/CustomerId"
      responses:
        "204":
          description: Customer deleted
        "403":
          description: Admin access required
        "404":
          description: Customer not found
    patch:
      operationId: updateCustomer
      tags: [crm]
      summary: Update customer
      parameters:
        - $ref: "#/components/parameters/CustomerId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerUpdate"
      responses:
        "200":
          description: Updated customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "404":
          description: Customer not found
  /customers/{id}/activity:
    get:
      operationId: listCustomerActivity
      tags: [crm]
      summary: List customer activity
      parameters:
        - $ref: "#/components/parameters/CustomerId"
      responses:
        "200":
          description: Customer activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CallLog"
  /customers/{id}/credit-checks:
    get:
      operationId: listCustomerCreditChecks
      tags: [crm]
      summary: List credit checks for a customer
      parameters:
        - $ref: "#/components/parameters/CustomerId"
      responses:
        "200":
          description: Credit-check history
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CustomerCreditCheck" }
    post:
      operationId: initiateCustomerCreditCheck
      tags: [crm]
      summary: Initiate an ICS24 credit check
      parameters:
        - $ref: "#/components/parameters/CustomerId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreditCheckInitiateInput" }
      responses:
        "201":
          description: OTP request created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerCreditCheck" }
  /customers/{id}/credit-checks/{checkId}/validate:
    post:
      operationId: validateCustomerCreditCheck
      tags: [crm]
      summary: Validate the OTP for a credit check
      parameters:
        - $ref: "#/components/parameters/CustomerId"
        - name: checkId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreditCheckOtpInput" }
      responses:
        "200":
          description: Updated credit check
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerCreditCheck" }
  /customers/{id}/credit-checks/{checkId}/renew:
    post:
      operationId: renewCustomerCreditCheckOtp
      tags: [crm]
      summary: Renew the credit-check OTP
      parameters:
        - $ref: "#/components/parameters/CustomerId"
        - name: checkId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Updated credit check
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerCreditCheck" }
  /customers/{id}/credit-checks/{checkId}/status:
    post:
      operationId: refreshCustomerCreditCheckStatus
      tags: [crm]
      summary: Refresh the status and report of a credit check
      parameters:
        - $ref: "#/components/parameters/CustomerId"
        - name: checkId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Updated credit check
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerCreditCheck" }
  /customers/{id}/credit-checks/{checkId}/report.pdf:
    get:
      operationId: downloadCustomerCreditCheckReport
      tags: [crm]
      summary: Download the generated ICS24 credit report as PDF
      parameters:
        - $ref: "#/components/parameters/CustomerId"
        - name: checkId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Generated credit report PDF
          content:
            application/pdf:
              schema:
                type: string
                format: binary
  /salespersons:
    get:
      operationId: listSalespersons
      tags: [crm]
      summary: List salespersons
      responses:
        "200":
          description: Salespersons
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Salesperson"
  /allocation-programs:
    get:
      operationId: listAllocationPrograms
      tags: [crm]
      summary: List fair allocation programs
      responses:
        "200":
          description: Allocation programs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AllocationProgram"
    post:
      operationId: createAllocationProgram
      tags: [crm]
      summary: Create a fair allocation program
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AllocationProgramInput"
      responses:
        "201":
          description: Created allocation program
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AllocationProgram"
  /allocation-programs/{id}:
    patch:
      operationId: updateAllocationProgram
      tags: [crm]
      summary: Update a fair allocation program
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AllocationProgramInput"
      responses:
        "200":
          description: Updated allocation program
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AllocationProgram"
  /reminders:
    get:
      operationId: listReminders
      tags: [crm]
      summary: List reminders
      parameters:
        - name: done
          in: query
          schema:
            type: boolean
        - name: due
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Reminders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Reminder"
    post:
      operationId: createReminder
      tags: [crm]
      summary: Create a reminder for the current user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReminderInput"
      responses:
        "201":
          description: Created reminder
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reminder"
    patch:
      operationId: updateReminder
      tags: [crm]
      summary: Mark a reminder done
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReminderUpdate"
      responses:
        "200":
          description: Updated reminder
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reminder"
  /reminders/{id}/acknowledge:
    post:
      operationId: acknowledgeReminder
      tags: [crm]
      summary: Mark a due reminder notification as shown
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Acknowledged reminder
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reminder"
  /calls:
    get:
      operationId: listCalls
      tags: [crm]
      summary: List call history
      parameters:
        - name: search
          in: query
          schema: { type: string }
        - name: customerId
          in: query
          schema: { type: integer }
        - name: salespersonId
          in: query
          schema: { type: integer }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Call history page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallPage"
    post:
      operationId: createCall
      tags: [crm]
      summary: Add a call log
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CallInput"
      responses:
        "201":
          description: Created call log
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallRecord"
  /consultations:
    get:
      operationId: listConsultations
      tags: [crm]
      summary: List consultation requests
      parameters:
        - name: search
          in: query
          schema: { type: string }
        - name: customerId
          in: query
          schema: { type: integer }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Consultation request page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsultationPage"
    post:
      operationId: createConsultation
      tags: [crm]
      summary: Create a consultation request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsultationInput"
      responses:
        "201":
          description: Created consultation request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Consultation"
  /consultations/{id}:
    get:
      operationId: getConsultation
      tags: [crm]
      summary: Get consultation request
      parameters:
        - $ref: "#/components/parameters/GenericId"
      responses:
        "200":
          description: Consultation request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Consultation"
        "404": { description: Consultation not found }
    patch:
      operationId: updateConsultation
      tags: [crm]
      summary: Update consultation request
      parameters:
        - $ref: "#/components/parameters/GenericId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsultationUpdate"
      responses:
        "200":
          description: Updated consultation request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Consultation"
        "404": { description: Consultation not found }
  /consultations/{id}/loan-plan-matches:
    get:
      operationId: matchConsultationLoanPlans
      tags: [crm]
      summary: Match active financing plans to a consultation
      parameters:
        - $ref: "#/components/parameters/GenericId"
      responses:
        "200":
          description: Financing plan eligibility results
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LoanPlanMatch" }
        "404": { description: Consultation not found }
  /consultations/{id}/loan-applications:
    post:
      operationId: createConsultationLoanApplication
      tags: [crm]
      summary: Register a loan application from a consultation recommendation
      parameters:
        - $ref: "#/components/parameters/GenericId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoanApplicationInput"
      responses:
        "201":
          description: Created loan application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoanApplication"
  /loan-plans:
    get:
      operationId: listLoanPlans
      tags: [crm]
      summary: List financing plans
      parameters:
        - name: active
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: Financing plans
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LoanPlan" }
    post:
      operationId: createLoanPlan
      tags: [crm]
      summary: Create a financing plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoanPlanInput"
      responses:
        "201":
          description: Created financing plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoanPlan"
  /loan-plans/{id}:
    get:
      operationId: getLoanPlan
      tags: [crm]
      summary: Get financing plan details
      parameters:
        - $ref: "#/components/parameters/GenericId"
      responses:
        "200":
          description: Financing plan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoanPlan" }
        "404": { description: Financing plan not found }
    patch:
      operationId: updateLoanPlan
      tags: [crm]
      summary: Update financing plan
      parameters:
        - $ref: "#/components/parameters/GenericId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoanPlanUpdate"
      responses:
        "200":
          description: Updated financing plan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoanPlan" }
        "404": { description: Financing plan not found }
  /loan-applications:
    get:
      operationId: listLoanApplications
      tags: [loan-applications]
      summary: List loan applications within assigned scope
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        "200":
          description: Applications
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoanApplicationPage" }
    post:
      operationId: createLoanApplication
      tags: [loan-applications]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoanApplicationInput" }
      responses:
        "201":
          description: Created application
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoanApplication" }
  /loan-applications/{id}:
    get:
      operationId: getLoanApplication
      tags: [loan-applications]
      parameters: [{ $ref: "#/components/parameters/GenericId" }]
      responses:
        "200":
          description: Application
          content: { application/json: { schema: { $ref: "#/components/schemas/LoanApplication" } } }
    patch:
      operationId: updateLoanApplication
      tags: [loan-applications]
      parameters: [{ $ref: "#/components/parameters/GenericId" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/LoanApplicationUpdate" } } }
      responses:
        "200": { description: Updated application }
    delete:
      operationId: deleteLoanApplication
      tags: [loan-applications]
      parameters: [{ $ref: "#/components/parameters/GenericId" }]
      responses: { "204": { description: Soft deleted } }
  /loan-applications/{id}/manual-requirements:
    post:
      operationId: addLoanApplicationManualRequirement
      tags: [loan-applications]
      parameters: [{ $ref: "#/components/parameters/GenericId" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ManualRequirementInput" } } } }
      responses: { "201": { description: Requirement, content: { application/json: { schema: { type: object } } } } }
  /loan-applications/{id}/manual-requirements/{documentId}:
    delete:
      operationId: deleteLoanApplicationManualRequirement
      tags: [loan-applications]
      parameters: [{ $ref: "#/components/parameters/GenericId" }, { $ref: "#/components/parameters/DocumentId" }]
      responses: { "204": { description: Deleted } }
  /loan-applications/{id}/documents:
    post:
      operationId: uploadLoanApplicationDocument
      tags: [loan-applications]
      parameters: [{ $ref: "#/components/parameters/GenericId" }]
      requestBody: { required: true, content: { multipart/form-data: { schema: { $ref: "#/components/schemas/PrivateFileUpload" } } } }
      responses: { "201": { description: Uploaded, content: { application/json: { schema: { type: object } } } } }
  /loan-applications/{id}/documents/{documentId}/download:
    get:
      operationId: downloadLoanApplicationDocument
      tags: [loan-applications]
      parameters: [{ $ref: "#/components/parameters/GenericId" }, { $ref: "#/components/parameters/DocumentId" }]
      responses: { "200": { description: Private file } }
  /loan-applications/{id}/documents/{documentId}:
    delete:
      operationId: deleteLoanApplicationDocument
      tags: [loan-applications]
      parameters: [{ $ref: "#/components/parameters/GenericId" }, { $ref: "#/components/parameters/DocumentId" }]
      responses: { "204": { description: Deleted } }
  /loan-applications/{id}/documents/{documentId}/review:
    post:
      operationId: reviewLoanApplicationDocument
      tags: [loan-applications]
      parameters: [{ $ref: "#/components/parameters/GenericId" }, { $ref: "#/components/parameters/DocumentId" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ReviewDecision" } } } }
      responses: { "200": { description: Reviewed, content: { application/json: { schema: { $ref: "#/components/schemas/ReviewResult" } } } } }
  /loan-applications/{id}/guarantor:
    post:
      operationId: registerLoanApplicationGuarantor
      tags: [loan-applications]
