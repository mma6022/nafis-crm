        reviewReason: { type: ["string", "null"] }
    CustomerPortalApplicationIdentityDocument:
      type: object
      required: [id, documentType, originalName, mimeType, sizeBytes, status, reviewReason, createdAt]
      properties:
        id: { type: integer }
        documentType: { type: string }
        originalName: { type: string }
        mimeType: { type: string }
        sizeBytes: { type: integer }
        status: { type: string }
        reviewReason: { type: ["string", "null"] }
        createdAt: { type: string }
    CustomerPortalApplication:
      type: object
      required: [id, planId, planName, status, stage, createdAt, updatedAt, requestedAmount, approvedAmount, requestedDurationMonths, durationMonths, conditionId, notes, editable, currentPrimaryContractSigned, initialContractRetained, documents, requiredDocuments, identityDocuments]
      properties:
        id: { type: integer }
        planId: { type: integer }
        planName: { type: ["string", "null"] }
        status: { type: string }
        stage: { type: string }
        createdAt: { type: string }
        updatedAt: { type: string }
        requestedAmount: { type: string }
        cashPayoutAmount:
          type: ["string", "null"]
          description: Estimated customer cash payout in toman from this case's stored plan and selected duration; never the credit-wallet principal.
        cashPayoutEstimated:
          type: boolean
          description: True when the displayed payout is a projection rather than a confirmed payment.
        approvedAmount:
          type: ["string", "null"]
          description: Provider-approved principal, null until initial provider approval.
        requestedDurationMonths: { type: integer }
        durationMonths: { type: integer }
        conditionId: { type: ["integer", "null"] }
        notes: { type: ["string", "null"] }
        editable:
          type: boolean
          description: Always false; customers track submitted cases while staff manage contract information.
        salesExpert:
          type: ["object", "null"]
          required: [name, mobile]
          properties:
            name: { type: string }
            mobile: { type: ["string", "null"] }
        currentPrimaryContractSigned:
          type: boolean
          description: True only when the current primary generation has a verified provider signature; superseded generations do not count.
        initialContractRetained:
          type: boolean
          description: True when initial provider approval retained the already-signed requested-principal primary contract.
        documents: { type: array, items: { $ref: "#/components/schemas/CustomerPortalApplicationDocument" } }
        requiredDocuments: { type: array, items: { $ref: "#/components/schemas/CustomerPortalApplicationRequirement" } }
        identityDocuments: { type: array, items: { $ref: "#/components/schemas/CustomerPortalApplicationIdentityDocument" } }
    CustomerPortalApplications:
      type: object
      required: [applications]
      properties:
        applications: { type: array, items: { $ref: "#/components/schemas/CustomerPortalApplication" } }
    CustomerPortalApplicationInput:
      type: object
      required: [planId, conditionId, requestedAmount, durationMonths, feeChargeId]
      properties:
        planId: { type: integer, minimum: 1 }
        conditionId: { type: integer, minimum: 1 }
        requestedAmount: { type: string, pattern: "^[1-9][0-9]{0,17}$" }
        durationMonths: { type: integer, minimum: 1, maximum: 600 }
        feeChargeId: { type: integer, minimum: 1 }
        notes: { type: ["string", "null"], maxLength: 2000 }
    CustomerPortalApplicationUpdate:
      type: object
      minProperties: 1
      properties:
        requestedAmount: { type: string, pattern: "^[1-9][0-9]{0,17}$" }
        durationMonths: { type: integer, minimum: 1, maximum: 600 }
        manualValues: { type: object, additionalProperties: { type: string, maxLength: 5000 } }
        notes: { type: ["string", "null"], maxLength: 2000 }
    CustomerPortalApplicationDocumentUploadInput:
      type: object
      required: [requirementKey, file]
      properties:
        requirementKey: { type: string, minLength: 1 }
        file: { type: string, format: binary }
    PortalIntakeState:
      type: object
      required: [creditValid, creditRank, planEligible, feeChargeId, filingFeeToman, verification, documentsComplete, documentsPreviouslyApproved, canSubmit]
      properties:
        creditValid: { type: boolean }
        creditRank: { type: ["string", "null"] }
        planEligible: { type: boolean }
        feeChargeId: { type: ["integer", "null"] }
        existingApplicationId: { type: ["integer", "null"] }
        filingFeeToman: { type: string }
        documentsComplete: { type: boolean }
        documentsPreviouslyApproved: { type: boolean }
        requiredDocumentTypes:
          type: array
          items: { type: string }
        canSubmit: { type: boolean }
        verification:
          type: object
          required: [postalOk, sanaOk, postalAnswered, sanaAnswered, postalCode]
          properties:
            postalOk: { type: boolean }
            sanaOk: { type: boolean }
            postalAnswered: { type: boolean }
            sanaAnswered: { type: boolean }
            inquiryAttempted: { type: boolean }
            postalCode: { type: ["string", "null"] }
    PortalQuestionnaireInput:
      type: object
      additionalProperties: false
      required: [questionnaireVersion, creditRank, customerCheckStatus, hasCustomerSalaryDeduct, jobType, hasGuarantor]
      properties:
        questionnaireVersion: { type: integer, enum: [2] }
        creditRank: { type: string }
        customerCheckStatus: { type: string }
        hasCustomerSalaryDeduct: { type: boolean }
        jobType: { type: string }
        hasGuarantor: { type: boolean }
        guarantorCreditRank: { type: ["string", "null"] }
        guarantorCheckType: { type: ["string", "null"] }
        hasGuarantorSalaryDeduct: { type: boolean }
        requestedAmount: { type: ["string", "null"] }
    PortalIntakeVerifyInput:
      type: object
      required: [planId, postalCode]
      additionalProperties: false
      properties:
        planId: { type: integer, minimum: 1 }
        postalCode: { type: string, pattern: "^[0-9]{10}$" }
    HumanChatRead:
      type: object
      required: [lastMessageId]
      additionalProperties: false
      properties:
        lastMessageId: { type: integer, minimum: 1 }
    HumanChatSend:
      type: object
      required: [clientId, text]
      additionalProperties: false
      properties:
        clientId: { type: string, minLength: 8, maxLength: 100 }
        text: { type: string, minLength: 1, maxLength: 6000 }
    HumanChatUpload:
      type: object
      required: [clientId, file]
      properties:
        clientId: { type: string, minLength: 8, maxLength: 100 }
        text: { type: string, maxLength: 6000 }
        file: { type: string, format: binary }
    HumanChatMessage:
      type: object
      required: [id, customerId, senderType, senderName, text, kind, clientId, createdAt]
      properties:
        id: { type: integer }
        customerId: { type: integer }
        senderType: { type: string, enum: [customer, staff] }
        senderName: { type: string }
        text: { type: string }
        kind: { type: string, enum: [text, image, audio, file] }
        clientId: { type: string }
        createdAt: { type: string }
        fileUrl: { type: ["string", "null"] }
        fileName: { type: ["string", "null"] }
        mimeType: { type: ["string", "null"] }
        fileSize: { type: ["integer", "null"] }
    HumanChatPage:
      type: object
      required: [items, nextCursor, lastReadId]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/HumanChatMessage" }
        nextCursor: { type: ["string", "null"] }
        lastReadId: { type: integer }
    HumanChatThreads:
      type: object
      required: [items, nextCursor]
      properties:
        nextCursor: { type: ["string", "null"] }
        items:
          type: array
          items:
            type: object
            required: [customerId, name, mobile, online, unreadCount]
            properties:
              customerId: { type: integer }
              name: { type: string }
              mobile: { type: string }
              online: { type: boolean }
              lastMessage: { type: ["string", "null"] }
              lastMessageAt: { type: ["string", "null"] }
              unreadCount: { type: integer }
