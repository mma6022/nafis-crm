        customerName: { type: string }
        customerSalespersonName: { type: ["string", "null"] }
        planName: { type: ["string", "null"] }
        planId: { type: integer }
        approvedAmount: { type: ["string", "null"] }
        netAmount: { type: ["string", "null"] }
        approvedAmountSource: { type: ["string", "null"], enum: [initial_provider_approval, signed_primary_reconciliation, null] }
