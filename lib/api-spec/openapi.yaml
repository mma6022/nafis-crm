      description: Fetches a fresh provider-reported signature status. This lookup does not persist provider status or advance any linked loan workflow.
      tags: [contracts]
      parameters: [{ $ref: "#/components/parameters/GenericId" }]
      responses:
        "200":
          description: Fresh provider-reported status with no workflow mutation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReadOnlySignatureStatus" }
    post:
      operationId: checkContractSignatureStatus
      summary: Check signature status and continue eligible workflow
      description: Fetches a fresh provider signature-status observation. If the provider reports a positive signature for the current pending case, the server continues the eligible workflow and reports any actual stage transition in workflowAdvanced and nextStage. Signature verification does not run financial, PDF, or unit checks. The signed value indicates provider-reported completion only, not financial approval.
      tags: [contracts]
      parameters: [{ $ref: "#/components/parameters/GenericId" }]
      responses:
        "200":
          description: Fresh provider-reported signature status and any eligible workflow continuation; signed is provider completion, not financial approval
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContractSignatureStatus" }
  /voip/config:
    get:
      operationId: getVoipConfig
      tags: [voip]
      responses:
        "200":
          description: Browser VoIP configuration for the current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VoipConfig" }
    put:
      operationId: updateVoipConfig
      tags: [voip]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VoipConfigUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VoipOk" }
  /voip/extensions:
    get:
      operationId: listVoipExtensions
      tags: [voip]
      responses:
        "200":
          description: Active users and extension assignments
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VoipExtensions" }
  /voip/extensions/{userId}:
    put:
      operationId: updateVoipExtension
      tags: [voip]
      parameters:
        - in: path
          name: userId
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VoipExtensionUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VoipOk" }
  /voip/contacts:
    get:
      operationId: listVoipContacts
      tags: [voip]
      parameters:
        - in: query
          name: search
          schema: { type: string, maxLength: 100 }
      responses:
        "200":
          description: Scoped phonebook search
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VoipContacts" }
  /voip/lookup:
    get:
      operationId: lookupVoipCustomer
      tags: [voip]
      parameters:
        - in: query
          name: phone
          required: true
          schema: { type: string, minLength: 1, maxLength: 32 }
      responses:
        "200":
          description: Exact scoped normalized-phone match
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VoipCustomerLookup" }
  /voip/calls:
    get:
      operationId: listVoipCalls
      tags: [voip]
      parameters:
        - in: query
          name: customerId
          schema: { type: integer, minimum: 1 }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, maximum: 1000000, default: 1 }
      responses:
        "200":
          description: Browser-reported call history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VoipCalls" }
    post:
      operationId: createVoipCall
      tags: [voip]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VoipCallInput" }
      responses:
        "200":
          description: Event accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VoipOk" }
  /voip/after-call/pending:
    get:
      operationId: listPendingVoipAfterCalls
      tags: [voip]
      responses:
        "200":
          description: New completed calls awaiting expert notes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VoipAfterCallPending" }
  /voip/after-call/{id}:
    patch:
      operationId: completeVoipAfterCall
      tags: [voip]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VoipAfterCallCompletion" }
      responses:
        "200":
          description: Notes and optional priority saved atomically without another history row
          content:
            application/json:
              schema:
                type: object
                required: [ok, callLogId]
                properties:
                  ok: { type: boolean }
                  callLogId: { type: ["integer", "null"] }
  /voip/recordings/{id}/transcript:
    get:
      operationId: getVoipRecordingTranscript
      tags: [voip]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: from, in: query, required: true, schema: { type: string } }
        - { name: to, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Authorized recording transcription and processing state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VoipRecordingTranscript" }
    post:
      operationId: createVoipRecordingTranscript
      tags: [voip]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VoipTranscriptRequest" }
      responses:
        "200":
          description: Existing result or durably queued transcription; repeated requests do not bill twice
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VoipRecordingTranscript" }
  /voip/recordings/{id}/transcript/summary:
    patch:
      operationId: updateVoipRecordingSummary
      tags: [voip]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VoipCallSummaryEdit" }
      responses:
        "200":
          description: Persisted human correction with optimistic concurrency
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VoipRecordingTranscript" }
        "409":
          description: Transcript or manual correction changed; draft must not be overwritten
    post:
      operationId: createVoipRecordingSummary
      tags: [voip]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VoipCallSummaryRequest" }
      responses:
        "200":
          description: Persisted summary or queued summary retry; transcription is not repeated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VoipRecordingTranscript" }
  /voip/recordings:
    get:
      operationId: listVoipRecordings
      tags: [voip]
      parameters:
        - { in: query, name: from, schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' } }
        - { in: query, name: to, schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' } }
        - { in: query, name: extension, schema: { type: string, maxLength: 32 } }
        - { in: query, name: phone, schema: { type: string, maxLength: 32 } }
        - { in: query, name: status, schema: { type: string, enum: [ANSWERED, NO ANSWER, BUSY, FAILED] } }
        - { in: query, name: recordedOnly, schema: { type: boolean, default: false } }
        - { in: query, name: page, schema: { type: integer, minimum: 1, maximum: 100000, default: 1 } }
      responses:
        "200":
          description: Authorized PBX call reports; provider URLs and filenames are never exposed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VoipRecordings" }
        "422": { description: Own extension is not assigned }
        "502": { description: Invalid provider response }
        "503": { description: Provider is unavailable or not configured }
  /voip/recordings/{id}/audio:
    get:
      operationId: downloadVoipRecording
      tags: [voip]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, maxLength: 128 } }
        - { in: query, name: from, schema: { type: string } }
        - { in: query, name: to, schema: { type: string } }
      responses:
        "200":
          description: Private audio attachment streamed by CRM after rechecking access
          content:
            audio/mpeg:
              schema: { type: string, format: binary }
        "404": { description: Call or recording not available to this user }
  /customer-portal/auth/otp/request:
    post:
      operationId: requestCustomerPortalOtp
      tags: [customer-portal]
      summary: Request a customer portal one-time verification code
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerPortalOtpRequestInput" }
      responses:
        "202":
          description: Generic response that does not reveal mobile eligibility
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerPortalOtpRequestResult" }
        "502": { description: SMS delivery failed }
        "503": { description: SMS delivery is not configured }
  /customer-portal/auth/otp/verify:
    post:
      operationId: verifyCustomerPortalOtp
      tags: [customer-portal]
      summary: Verify a customer portal one-time code and establish a session
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerPortalOtpVerifyInput" }
      responses:
        "200":
          description: Authenticated customer portal session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerPortalSession" }
        "400": { description: Invalid mobile or code format }
        "401": { description: Invalid or expired mobile/code pair }
        "409": { description: Customer identity is ambiguous }
        "429": { description: Verification attempt rate limit exceeded }
  /customer-portal/auth/logout:
    post:
      operationId: logoutCustomerPortal
      tags: [customer-portal]
      summary: End the customer portal session
      responses:
        "200":
          description: Session ended
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerPortalOk" }
  /customer-portal/me:
    get:
      operationId: getCustomerPortalMe
      tags: [customer-portal]
      summary: Get the current customer portal session and profile
      responses:
        "200":
          description: Current authenticated mobile and associated customer profile, if present
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerPortalMe" }
        "401": { description: Customer authentication required }
  /customer-portal/identity:
    post:
      operationId: onboardCustomerPortalIdentity
      tags: [customer-portal]
      summary: Verify mobile ownership and official identity using national code and Jalali birth date
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerPortalIdentityRequest" }
      responses:
        "200":
          description: Basic customer identity and mobile ownership verified
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerPortalIdentityResponse" }
        "400": { description: Invalid national code or birth date }
        "401": { description: Fresh OTP session required }
        "409": { description: Identity conflict or concurrent change }
        "422": { description: Identity or mobile ownership could not be verified }
        "429": { description: Identity request rate limit exceeded }
        "503": { description: Registration temporarily unavailable }
  /customer-portal/profile:
    patch:
      operationId: updateCustomerPortalProfile
      tags: [customer-portal]
      summary: Create or update the current customer's profile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerPortalProfileInput" }
      responses:
        "200":
          description: Existing profile updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerPortalProfileResult" }
        "201":
          description: New profile created and linked to the session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerPortalProfileResult" }
        "400": { description: Invalid or incomplete profile data }
        "401": { description: Customer authentication required }
        "409": { description: Profile unavailable or identity conflict }
        "503": { description: Customer registration unavailable }
  /customer-portal/verify:
    post:
      operationId: verifyCustomerPortalIdentity
      tags: [customer-portal]
      summary: Verify the current customer's identity
      responses:
        "200":
          description: Identity check result; checks can be null until the profile is complete
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerPortalVerificationResult" }
        "409":
          description: Customer profile is missing or changed during verification
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerPortalVerificationPending" }
  /customer-portal/consultations:
    get:
      operationId: listCustomerPortalConsultations
      tags: [customer-portal]
      summary: List the current customer's consultation conversations
      responses:
        "200":
          description: Conversations ordered by most recently updated
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CustomerPortalConsultation" }
        "403": { description: Identity verification required }
        "409": { description: Customer profile required }
    post:
      operationId: createCustomerPortalConsultation
      tags: [customer-portal]
      summary: Create a consultation conversation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerPortalConsultationInput" }
      responses:
        "201":
          description: Created consultation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerPortalConsultation" }
        "400": { description: Invalid title or input properties }
        "403": { description: Identity verification required }
        "409": { description: Customer profile required }
  /customer-portal/consultations/{conversationId}/messages:
    get:
      operationId: listCustomerPortalConsultationMessages
      tags: [customer-portal]
      summary: Get a consultation and its messages
      parameters:
        - name: conversationId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Conversation and up to 100 ordered messages
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerPortalConsultationMessages" }
        "403": { description: Identity verification required }
        "404": { description: Conversation not found }
        "409": { description: Customer profile required }
    post:
      operationId: createCustomerPortalConsultationMessage
      tags: [customer-portal]
      summary: Send a message and receive the assistant response
      parameters:
        - name: conversationId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerPortalMessageInput" }
      responses:
        "201":
          description: User message and generated assistant reply
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerPortalMessageExchange" }
        "400": { description: Invalid message or message length }
        "403": { description: Identity verification required }
        "404": { description: Conversation not found }
        "409": { description: Customer profile required }
        "429": { description: Daily consultation message limit reached }
        "502": { description: Assistant response unavailable }
  /customer-portal/loan-options:
    get:
      operationId: listCustomerPortalLoanOptions
      tags: [customer-portal]
      summary: List active payable loan plans and their eligible terms
      responses:
        "200":
          description: Loan options for the signed-in customer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerPortalLoanOptions" }
        "401": { description: Customer authentication required }
        "404": { description: Customer profile not found }
  /customer-portal/identity-documents:
    get:
      operationId: listCustomerPortalIdentityDocuments
      tags: [customer-portal]
      summary: List the customer's latest identity documents
      responses:
        "200":
          description: Latest identity documents
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerPortalIdentityDocuments" }
    post:
      operationId: uploadCustomerPortalIdentityDocument
      tags: [customer-portal]
      summary: Upload or replace an identity document
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/CustomerPortalIdentityDocumentUploadInput" }
      responses:
        "201":
          description: Identity document uploaded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerPortalIdentityDocument" }
        "400": { description: "Invalid document type or file; only PDF, JPEG and PNG are accepted" }
        "413": { description: File exceeds the 10 MiB size limit }
        "500": { description: Identity document upload failed }
  /customer-portal/identity-documents/{documentId}/preview:
    get:
      operationId: previewCustomerPortalIdentityDocument
      tags: [customer-portal]
      summary: View the signed-in customer's current identity image or PDF
      parameters:
        - in: path
          name: documentId
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Private file; never cached
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
            application/pdf:
              schema: { type: string, format: binary }
        "401": { description: Customer authentication required }
        "404": { description: Document not found or not owned by the current customer }
  /customer-portal/credit-checks:
    get:
      operationId: listCustomerPortalCreditChecks
      tags: [customer-portal]
      summary: List recent credit checks and refresh the latest in-progress check
      responses:
        "200":
          description: Up to 20 credit checks
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerPortalCreditChecks" }
    post:
      operationId: createCustomerPortalCreditCheck
      tags: [customer-portal]
      summary: Start an ICS24 credit check and request an OTP
      responses:
        "200":
          description: Existing in-progress check returned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerPortalCreditCheck" }
        "201":
          description: OTP request created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerPortalCreditCheck" }
        "422": { description: "Profile, identity, mobile or national code prerequisite failed" }
        "429": { description: Credit check request is rate limited or already starting }
        "502": { description: Credit-check provider unavailable }
  /customer-portal/credit-checks/{id}/validate:
    post:
      operationId: validateCustomerPortalCreditCheckOtp
      tags: [customer-portal]
      summary: Validate the OTP for a customer credit check
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerPortalCreditCheckOtpInput" }
      responses:
        "200":
          description: Updated credit-check status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerPortalCreditCheck" }
        "400": { description: Invalid OTP format }
        "404": { description: Credit check not found }
        "409": { description: Credit check is not awaiting an OTP }
        "422": { description: OTP rejected }
  /customer-portal/credit-checks/{id}/renew:
    post:
      operationId: renewCustomerPortalCreditCheckOtp
      tags: [customer-portal]
      summary: Renew the OTP for a customer credit check
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Updated credit-check status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerPortalCreditCheck" }
        "404": { description: Credit check not found }
        "409": { description: Credit check is not awaiting an OTP }
        "502": { description: Credit-check provider unavailable }
  /customer-portal/wallet:
    get:
      operationId: getCustomerPortalWallet
      tags: [customer-portal]
      summary: Get the customer's cash and credit wallet balances
      responses:
        "200":
          description: Wallet balances in Toman
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerPortalWallet" }
  /customer-portal/wallet/transactions:
    get:
      operationId: getCustomerPortalWalletTransactions
      tags: [customer-portal]
      summary: Read only the current customer's posted wallet entries
      parameters:
        - name: cursor
          in: query
          schema: { type: string, pattern: "^[1-9][0-9]*$" }
      responses:
        "200":
          description: Newest-first page of twenty entries
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerWalletTransactionPage" }
        "401": { description: Customer authentication required }
  /customer-portal/wallet/transfer-recipient:
    post:
      operationId: prepareCustomerPortalCashTransfer
      tags: [customer-portal]
      summary: Prepare an amount-bound cash transfer to one exact mobile number
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerCashRecipientInput" }
      responses:
        "200":
          description: Recipient name and five-minute confirmation token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerCashRecipient" }
        "400": { description: Invalid input or self transfer }
        "401": { description: Customer authentication required }
        "404": { description: No unique active recipient }
        "409": { description: Insufficient cash }
        "429": { description: Lookup rate limit }
  /customer-portal/wallet/transfers:
    post:
      operationId: confirmCustomerPortalCashTransfer
      tags: [customer-portal]
      summary: Atomically confirm a current customer's cash-to-cash transfer
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 8, maxLength: 200 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerCashConfirmationInput" }
      responses:
        "200":
          description: Completed transfer, including a safe replay of the same attempt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerCashTransferReceipt" }
        "400": { description: Invalid or mismatched confirmation }
        "401": { description: Customer authentication required }
        "409": { description: "Expired, used, changed, conflicting or insufficient-cash attempt" }
  /customer-portal/wallet/top-up:
    post:
      operationId: createCustomerPortalWalletTopUp
      tags: [customer-portal]
      summary: Create a customer wallet top-up payment URL
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerPortalWalletTopUpInput" }
      responses:
        "201":
          description: Payment URL created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerPortalWalletTopUp" }
        "400": { description: Invalid amount }
        "409": { description: An active top-up already exists }
        "503": { description: Payment configuration unavailable }
  /customer-portal/filing-fee:
    post:
      operationId: chargeCustomerPortalFilingFee
      tags: [customer-portal]
      summary: Charge the filing fee for a loan plan
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 8, maxLength: 200, pattern: "^[\\x20-\\x7e]+$" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerPortalFilingFeeInput" }
      responses:
        "200":
          description: Existing idempotent charge returned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerPortalFilingFee" }
        "201":
          description: Filing fee charged
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerPortalFilingFee" }
        "400": { description: Invalid filing-fee request or idempotency key }
        "409": { description: Idempotency conflict or insufficient cash balance }
        "422": { description: "Customer, credit, plan or wallet prerequisites failed" }
  /customer-portal/applications:
    get:
      operationId: listCustomerPortalApplications
      tags: [customer-portal]
      summary: List the customer's loan applications
      parameters:
        - name: active
          in: query
          description: Exclude completed and rejected or cancelled applications
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Applications belonging to the current customer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerPortalApplications" }
    post:
      operationId: createCustomerPortalApplication
      tags: [customer-portal]
      summary: Create an application using a previously charged filing fee
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerPortalApplicationInput" }
      responses:
        "200":
          description: Existing application associated with the filing fee returned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerPortalApplication" }
        "201":
          description: Application created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerPortalApplication" }
        "400": { description: Invalid application input or notes }
        "404": { description: Application resource not found }
        "409": { description: Filing fee already used }
        "422": { description: "Filing fee, identity documents, credit or selected plan prerequisites failed" }
  /customer-portal/applications/{id}:
    get:
      operationId: getCustomerPortalApplication
      tags: [customer-portal]
      summary: Get an application owned by the current customer
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Application details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerPortalApplication" }
        "404": { description: Loan application not found }
    patch:
      operationId: updateCustomerPortalApplication
      tags: [customer-portal]
      summary: Edit an application while it remains in the draft stage before primary contract generation or signature
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerPortalApplicationUpdate" }
      responses:
        "200":
          description: Updated application
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerPortalApplication" }
        "400": { description: Invalid application input or notes }
        "404": { description: Loan application not found }
        "409": { description: Application is not editable or approved terms are immutable }
        "422": { description: Updated terms do not meet plan eligibility }
  /customer-portal/applications/{id}/documents:
    post:
      operationId: uploadCustomerPortalApplicationDocument
      tags: [customer-portal]
      summary: Upload a required application document
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/CustomerPortalApplicationDocumentUploadInput" }
      responses:
        "201":
          description: Uploaded application document
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerPortalApplicationDocument" }
        "400": { description: Invalid application document or file }
        "404": { description: Application or document requirement not found }
        "409": { description: Application is not in a document-upload stage }

  /customer-portal/intake/status:
    get:
      operationId: getPortalIntakeStatus
      tags: [customer-portal]
      parameters:
        - { name: planId, in: query, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Current server-authorized intake prerequisites
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PortalIntakeState" }
  /customer-portal/intake/verify:
    post:
      operationId: verifyPortalIntake
      tags: [customer-portal]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PortalIntakeVerifyInput" }
      responses:
        "200":
          description: Persisted verification outcome
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [verified, error, pending] }
                  error: { type: ["string", "null"] }
                  checks: { type: ["object", "null"], additionalProperties: true }
  /customer-portal/plan-finder/options:
    get:
      operationId: getPortalQuestionnaireOptions
      tags: [customer-portal]
      responses:
        "200":
          description: Same active questionnaire options as staff consultation
          content:
            application/json:
              schema:
                type: object
                required: [options]
                properties:
                  options:
                    type: array
                    items:
                      type: object
                      required: [fieldKey, value, label]
                      properties:
                        fieldKey: { type: string }
                        value: { type: string }
                        label: { type: string }
  /customer-portal/plan-finder:
    post:
      operationId: findPortalLoanPlans
      tags: [customer-portal]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PortalQuestionnaireInput" }
      responses:
        "201":
          description: Historical questionnaire and matched-plan snapshot saved atomically
          content:
            application/json:
              schema:
                type: object
                required: [consultationId, matches]
                properties:
                  consultationId: { type: integer }
                  matches:
                    type: array
                    items: { $ref: "#/components/schemas/LoanPlanMatch" }
  /customer-portal/chat/thread:
    get:
      operationId: getPortalHumanChat
      tags: [customer-portal]
      responses:
        "200":
          description: Assigned expert and unread messages
          content:
            application/json:
              schema:
                type: object
                required: [customerId, expertName, expertOnline, unreadCount]
                properties:
                  customerId: { type: integer }
                  expertName: { type: string }
                  expertOnline: { type: boolean }
                  unreadCount: { type: integer }
  /customer-portal/chat/presence:
    post:
      operationId: updatePortalChatPresence
      tags: [customer-portal]
      responses:
        "200": { description: Current customer is online }
  /customer-portal/chat/read:
    post:
      operationId: markPortalChatRead
      tags: [customer-portal]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HumanChatRead" }
      responses:
        "200": { description: Monotonic read marker saved }
  /customer-portal/chat/messages:
    get:
      operationId: listPortalHumanMessages
      tags: [customer-portal]
      parameters:
        - { name: beforeId, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Own conversation history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HumanChatPage" }
    post:
      operationId: sendPortalHumanMessage
      tags: [customer-portal]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HumanChatSend" }
          multipart/form-data:
            schema: { $ref: "#/components/schemas/HumanChatUpload" }
      responses:
        "201":
          description: Idempotently persisted message
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HumanChatMessage" }
        "200":
          description: Prior message returned on retry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HumanChatMessage" }
  /customer-portal/chat/messages/{messageId}/file:
    get:
      operationId: downloadPortalHumanAttachment
      tags: [customer-portal]
      parameters:
        - { name: messageId, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Own private attachment, authenticated on every request
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
  /chat/presence:
    post:
      operationId: updateStaffChatPresence
      tags: [chat]
      responses:
        "200": { description: Staff member is online }
  /chat/unread-count:
    get:
      operationId: getStaffChatUnreadCount
      tags: [chat]
      responses:
        "200":
          description: Unread messages within authorized customer scope
          content:
            application/json:
              schema:
                type: object
                required: [count]
                properties:
                  count: { type: integer }
  /chat/threads:
    get:
      operationId: listStaffChatThreads
      tags: [chat]
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200":
          description: Scope-isolated customer conversations
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HumanChatThreads" }
  /chat/{customerId}/read:
    post:
      operationId: markStaffChatRead
      tags: [chat]
      parameters:
        - { name: customerId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HumanChatRead" }
      responses:
        "200": { description: Monotonic read marker saved within customer scope }
  /chat/{customerId}/messages:
    get:
      operationId: listStaffHumanMessages
      tags: [chat]
      parameters:
        - { name: customerId, in: path, required: true, schema: { type: integer } }
        - { name: beforeId, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Authorized customer conversation history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HumanChatPage" }
    post:
      operationId: sendStaffHumanMessage
      tags: [chat]
      parameters:
        - { name: customerId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HumanChatSend" }
          multipart/form-data:
            schema: { $ref: "#/components/schemas/HumanChatUpload" }
      responses:
        "201":
          description: Reply persisted within authorized scope
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HumanChatMessage" }
        "200":
          description: Prior reply returned on retry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HumanChatMessage" }
  /chat/messages/{messageId}/file:
    get:
      operationId: downloadStaffHumanAttachment
      tags: [chat]
      parameters:
        - { name: messageId, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Private attachment within authorized customer scope
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
components:
  parameters:
    CustomerId:
      name: id
      in: path
      required: true
      schema:
        type: integer
    GenericId:
      name: id
      in: path
      required: true
      schema: { type: integer }
    DocumentId:
      name: documentId
      in: path
      required: true
      schema: { type: integer }
    CollateralId:
      name: collateralId
      in: path
      required: true
      schema: { type: integer }
  schemas:
    MobileCallDeviceInput:
      type: object
      additionalProperties: false
      required: [userId, deviceName]
      properties:
        userId: { type: integer, minimum: 1 }
        deviceName: { type: string, minLength: 1, maxLength: 120 }
    MobileCallStart:
      type: object
      additionalProperties: false
      required: [callId, direction, callerNumber, calleeNumber, contactName, startedAt]
      properties:
        callId: { type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9_.:-]+$' }
        direction: { type: string, enum: [incoming, outgoing] }
        callerNumber: { type: string, minLength: 1, maxLength: 32 }
        calleeNumber: { type: string, minLength: 1, maxLength: 32 }
        contactName: { type: string, maxLength: 200 }
        startedAt: { type: string, format: date-time }
        answeredAt: { type: ["string", "null"], format: date-time }
    MobileCallEnd:
      allOf:
        - { $ref: "#/components/schemas/MobileCallStart" }
        - type: object
          required: [endedAt, durationSeconds, status]
          properties:
            endedAt: { type: string, format: date-time }
            durationSeconds: { type: integer, minimum: 0, maximum: 604800 }
            status: { type: string, enum: [completed, missed, rejected, failed] }
    MobileCallDevice:
      type: object
      required: [id, userId, expertName, deviceName, active, createdAt, lastSeenAt]
      properties:
        id: { type: integer }
        userId: { type: integer }
        expertName: { type: string }
        deviceName: { type: string }
        active: { type: boolean }
        createdAt: { type: string }
        lastSeenAt: { type: ["string", "null"] }
    MobileCall:
      type: object
      required: [id, callId, deviceId, deviceName, expertUserId, expertName, direction, callerNumber, calleeNumber, contactName, startedAt, answeredAt, endedAt, durationSeconds, status, isLive, subject, expertNotes, reportSavedAt, customerId]
      properties:
        id: { type: integer, description: Shared call event ID used by the report editor }
        callId: { type: string }
        deviceId: { type: integer }
        deviceName: { type: string }
        expertUserId: { type: integer }
        expertName: { type: string }
        direction: { type: string, enum: [incoming, outgoing] }
        callerNumber: { type: string }
        calleeNumber: { type: string }
        contactName: { type: string }
        startedAt: { type: string }
        answeredAt: { type: ["string", "null"] }
        endedAt: { type: ["string", "null"] }
        durationSeconds: { type: ["integer", "null"] }
        status: { type: string }
        isLive: { type: boolean }
        subject: { type: ["string", "null"] }
        expertNotes: { type: string }
        reportSavedAt: { type: ["string", "null"] }
        customerId: { type: ["integer", "null"] }
    AccountingFund:
      type: object
      required: [id, bankName, ownerName, fundName, iban, balanceToman, initialized]
      properties:
        id: { type: integer }
        bankName: { type: string }
        ownerName: { type: string }
        fundName: { type: string }
        iban: { type: string }
        balanceToman: { type: string, description: Exact nonnegative integer toman }
        initialized: { type: boolean }
    AccountingOpeningInput:
      type: object
      required: [amountToman]
      properties:
        amountToman: { type: string, description: Exact nonnegative integer toman; zero is allowed }
    AccountingDocumentInput:
      type: object
      required: [requestKey, fundId, documentDate, transactionDate, amountToman, purpose, documentType, transactionType]
      properties:
        requestKey: { type: string, minLength: 16, maxLength: 100 }
        fundId: { type: integer, minimum: 1 }
        documentDate: { type: string, format: date }
        transactionDate: { type: string, format: date, description: Actual transaction date, not in the future }
        amountToman: { type: string, description: Exact positive integer toman }
        purpose: { type: string, minLength: 1, maxLength: 1000 }
        documentType: { type: string, enum: [credit, debit] }
        transactionType: { type: string, enum: [deposit, withdrawal] }
        counterpartyAccountType: { type: string, enum: [iban, card], description: Optional account details; supply all three fields together. Source for deposits and destination for withdrawals. }
        counterpartyAccountNumber: { type: string, maxLength: 50, description: Iranian IBAN or 16-digit card; validated and normalized server-side. }
        counterpartyOwnerName: { type: string, minLength: 1, maxLength: 200, description: Manually entered owner name; no provider ownership verification implied. }
        files: { type: array, maxItems: 10, items: { type: string, format: binary }, description: JPEG/PNG/WebP/PDF, 8 MiB per file, 16 MiB combined }
    AccountingFilesInput:
      type: object
      required: [files]
      properties:
        files: { type: array, minItems: 1, maxItems: 10, items: { type: string, format: binary }, description: JPEG/PNG/WebP/PDF, 8 MiB per file, 16 MiB combined }
    AccountingAttachment:
      type: object
      required: [id, name, mime, size]
      properties:
        id: { type: integer }
        name: { type: string }
        mime: { type: string }
        size: { type: integer }
    AccountingDocument:
      type: object
      required: [id, fundId, fundName, documentDate, transactionDate, amountToman, purpose, documentType, transactionType, source, sourceOrderId, balanceBeforeToman, balanceAfterToman, createdAt, createdByName, attachments, counterpartyAccountType, counterpartyAccountNumber, counterpartyOwnerName]
      properties:
        id: { type: integer }
        fundId: { type: integer }
        fundName: { type: string }
        documentDate: { type: string, format: date }
        transactionDate: { type: string, format: date }
        amountToman: { type: string }
        purpose: { type: string }
        documentType: { type: string, enum: [credit, debit] }
        transactionType: { type: string, enum: [deposit, withdrawal] }
        source: { type: string, enum: [manual, payment_order, opening] }
        sourceOrderId: { type: [integer, "null"] }
        counterpartyAccountType: { type: [string, "null"], enum: [iban, card, null] }
        counterpartyAccountNumber: { type: [string, "null"] }
        counterpartyOwnerName: { type: [string, "null"] }
        balanceBeforeToman: { type: string }
        balanceAfterToman: { type: string }
        createdAt: { type: string }
        createdByName: { type: string }
        attachments: { type: array, items: { $ref: "#/components/schemas/AccountingAttachment" } }
    VoipAfterCallCompletion:
      type: object
      additionalProperties: false
      required: [expertNotes]
      properties:
        expertNotes: { type: string, maxLength: 10000 }
        discardHistory:
          type: boolean
          description: Close the pending event without customer history; remove only its provisional automatic history and retain the PBX call.
        subject: { type: ["string", "null"], maxLength: 160 }
        customerRequest: { type: ["string", "null"], maxLength: 1200 }
        priority: { type: ["integer", "null"], minimum: 0, maximum: 3 }
    VoipAfterCallNotice:
      type: object
      required: [id, externalId, phone, direction, status, startedAt, endedAt, extension, expertUserId, expertName, customerId, customerName, priority, callLogId, expertNotes, hasRecording]
      properties:
        id: { type: integer }
        externalId: { type: string }
        phone: { type: string }
        direction: { type: string }
        status: { type: string }
        startedAt: { type: string }
        endedAt: { type: string }
        extension: { type: ["string", "null"] }
        expertUserId: { type: ["integer", "null"] }
        expertName: { type: ["string", "null"] }
        customerId: { type: ["integer", "null"] }
        customerName: { type: ["string", "null"] }
        priority: { type: ["integer", "null"] }
        callLogId: { type: ["integer", "null"] }
        expertNotes: { type: string }
        hasRecording: { type: boolean }
        subject: { type: ["string", "null"] }
        customerRequest: { type: ["string", "null"] }
        recordingFrom: { type: string }
        recordingTo: { type: string }
        isLive: { type: boolean }
        systemSummary: { type: ["string", "null"] }
    VoipAfterCallPending:
      type: object
      required: [items, total, activatedAt, lastCheckedAt, syncError, canComplete, canEditPriority]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/VoipAfterCallNotice" } }
        total: { type: integer }
        activatedAt: { type: string }
        lastCheckedAt: { type: ["string", "null"] }
        syncError: { type: ["string", "null"] }
        canComplete: { type: boolean }
        canEditPriority: { type: boolean }
        liveEventSeenAt: { type: ["string", "null"] }
    VoipTranscriptRequest:
      type: object
      additionalProperties: false
      required: [from, to]
      properties:
        from: { type: string }
        to: { type: string }
        regenerate: { type: boolean, default: false, description: Explicitly replace a completed transcript using the current model; queued requests remain idempotent. }
    VoipTranscriptSegment:
      type: object
      required: [speakerId, startSeconds, endSeconds, text]
      properties:
        speakerId: { type: string }
        startSeconds: { type: number }
        endSeconds: { type: number }
        text: { type: string }
    VoipTranscriptSpeaker:
      type: object
      required: [id, label]
      properties:
        id: { type: string }
        label: { type: string }
    VoipRecordingTranscript:
      type: object
      required: [state, phase, error, model, durationSeconds, audioSeparation, notice, speakers, segments, text, completedAt, canGenerate, summaryState, summaryError, callSubject, customerRequestSummary]
      properties:
        state: { type: string, enum: [not_started, queued, processing, completed, failed] }
        phase: { type: ["string", "null"], enum: [null, downloading, cleaning, transcribing] }
        error: { type: ["string", "null"] }
        model: { type: ["string", "null"] }
        durationSeconds: { type: ["number", "null"] }
        audioSeparation: { type: ["string", "null"], enum: [null, stereo_channels, diarization] }
        notice: { type: ["string", "null"] }
        speakers: { type: array, items: { $ref: "#/components/schemas/VoipTranscriptSpeaker" } }
        segments: { type: array, items: { $ref: "#/components/schemas/VoipTranscriptSegment" } }
        text: { type: ["string", "null"] }
        completedAt: { type: ["string", "null"] }
        canGenerate: { type: boolean }
        summaryState: { type: string, enum: [not_started, queued, processing, completed, failed] }
        summaryError: { type: ["string", "null"] }
        callSubject: { type: ["string", "null"], maxLength: 160 }
        customerRequestSummary: { type: ["string", "null"], maxLength: 1200 }
        summaryRevision: { type: integer }
        summarySourceHash: { type: ["string", "null"] }
        summaryEdited: { type: boolean }
        summaryEditStale: { type: boolean }
    VoipCallSummaryEdit:
      type: object
      additionalProperties: false
      required: [from, to, callSubject, customerRequestSummary, expectedRevision, sourceHash]
      properties:
        from: { type: string }
        to: { type: string }
        callSubject: { type: string, maxLength: 160 }
        customerRequestSummary: { type: string, maxLength: 1200 }
        expectedRevision: { type: integer, minimum: 0 }
        sourceHash: { type: string, pattern: '^[a-f0-9]{64}$' }
    VoipCallSummaryRequest:
      type: object
      additionalProperties: false
      required: [from, to]
      properties:
        from: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        to: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
    VoipRecording:
      type: object
      required: [id, source, fromNumber, toNumber, direction, status, startedAt, durationSeconds, talkSeconds, extensions, expertNames, hasRecording, customerId, customerName]
      properties:
        id: { type: string }
        source: { type: string, enum: [simotel] }
        fromNumber: { type: string }
        toNumber: { type: string }
        direction: { type: string, enum: [incoming, outgoing, local, unknown] }
        status: { type: string }
        startedAt: { type: string }
        durationSeconds: { type: integer }
        talkSeconds: { type: integer }
        extensions: { type: array, items: { type: string } }
        expertNames: { type: array, items: { type: string } }
        hasRecording: { type: boolean }
        customerId: { type: ["integer", "null"] }
        customerName: { type: ["string", "null"] }
    VoipRecordings:
      type: object
      required: [items, total, recordedTotal, page, limit, from, to, canManage, ownExtension, fetchedAt]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/VoipRecording" } }
        total: { type: integer }
        recordedTotal: { type: integer }
        page: { type: integer }
        limit: { type: integer }
        from: { type: string }
        to: { type: string }
        canManage: { type: boolean }
        ownExtension: { type: ["string", "null"] }
        fetchedAt: { type: string }
    DuplicateCustomerCandidate:
      type: object
      required: [id, name, phone, nationalCode, salespersonName, historyCounts]
      properties:
        id: { type: integer }
        name: { type: string }
        phone: { type: string }
        nationalCode: { type: ["string", "null"] }
        salespersonName: { type: ["string", "null"] }
        historyCounts:
          type: object
          required: [calls, reminders, consultations, loanApplications, identityDocuments, creditChecks]
          properties:
            calls: { type: integer }
            reminders: { type: integer }
            consultations: { type: integer }
            loanApplications: { type: integer }
            identityDocuments: { type: integer }
            creditChecks: { type: integer }
    DuplicateCustomerGroup:
      type: object
      required: [matchType, normalizedValue, candidates]
      properties:
        matchType: { type: string, enum: [mobile, nationalCode] }
        normalizedValue: { type: string }
        candidates:
          type: array
          items: { $ref: "#/components/schemas/DuplicateCustomerCandidate" }
    CustomerMergeInput:
      type: object
      additionalProperties: false
      required: [sourceCustomerId, targetCustomerId, salespersonId]
      properties:
        sourceCustomerId: { type: integer, minimum: 1 }
        targetCustomerId: { type: integer, minimum: 1 }
        salespersonId: { type: integer, minimum: 1 }
    CustomerMergeResult:
      type: object
      required: [survivorCustomerId, archivedSourceCustomerId, salespersonId, reparentedHistoryCounts, preservedFinancialArtifacts]
      properties:
        survivorCustomerId: { type: integer }
        archivedSourceCustomerId: { type: integer }
        salespersonId: { type: integer }
        reparentedHistoryCounts:
          type: object
          additionalProperties: { type: integer }
        preservedFinancialArtifacts:
          type: array
          items: { type: string }
    VoipOk:
      type: object
      required: [ok]
      additionalProperties: false
      properties:
        ok: { type: boolean, const: true }
    VoipConfig:
      type: object
      additionalProperties: false
      required: [enabled, wssUrl, sipDomain, stunUrls, extension, authorizationUsername, canManage, historySyncAvailable, phonebookSyncAvailable]
      properties:
        enabled: { type: boolean }
        wssUrl: { type: string }
        sipDomain: { type: string }
        stunUrls: { type: array, items: { type: string } }
        extension: { type: ["string", "null"] }
        authorizationUsername: { type: ["string", "null"] }
        canManage: { type: boolean }
        historySyncAvailable: { type: boolean, const: false }
        phonebookSyncAvailable: { type: boolean, const: false }
