  /contracts/generations:
    get:
      operationId: listContractGenerations
      tags: [contracts]
      responses:
        "200":
          description: Generations
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ContractGeneration" } }
  /contracts/generations/{id}:
    get:
      operationId: getContractGeneration
      tags: [contracts]
      parameters: [{ $ref: "#/components/parameters/GenericId" }]
      responses:
        "200":
          description: Generation status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContractGeneration" }
    delete:
      operationId: deleteContractGeneration
      tags: [contracts]
      parameters: [{ $ref: "#/components/parameters/GenericId" }]
      responses:
