  /contracts/generations/{id}/download/{kind}:
    get:
      operationId: downloadContractGeneration
      tags: [contracts]
      parameters:
        - { $ref: "#/components/parameters/GenericId" }
        - name: kind
          in: path
          required: true
          schema: { type: string, enum: [docx, pdf] }
      responses: { "200": { description: Generated file, content: { application/octet-stream: { schema: { type: string, format: binary } } } } }
  /contracts/generations/{id}/send:
    post:
      operationId: sendContractGeneration
      tags: [contracts]
      parameters: [{ $ref: "#/components/parameters/GenericId" }]
      responses:
        "200":
          description: Provider delivery
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContractSendResult" }
  /contracts/generations/{id}/check-status:
    post:
      operationId: checkContractSignatureStatus
      tags: [contracts]
      parameters: [{ $ref: "#/components/parameters/GenericId" }]
      responses:
        "200":
          description: Current provider signature status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContractSignatureStatus" }
components:
  parameters:
    CustomerId:
      name: id
      in: path
      required: true
      schema:
        type: integer
    GenericId:
      name: id
      in: path
      required: true
      schema: { type: integer }
    DocumentId:
      name: documentId
      in: path
      required: true
      schema: { type: integer }
    CollateralId:
      name: collateralId
      in: path
      required: true
      schema: { type: integer }
  schemas:
    AuthLoginInput:
      type: object
      required: [username, password]
      properties:
        username: { type: string, minLength: 1, maxLength: 100 }
        password: { type: string, minLength: 1, maxLength: 200 }
    AuthSession:
      type: object
      required: [user]
      properties:
        user: { $ref: "#/components/schemas/CrmUser" }
    ConsultOption:
      type: object
      required: [id, fieldKey, value, labelFa, sortOrder]
      properties:
        id: { type: integer }
        fieldKey: { type: string }
        value: { type: string }
        labelFa: { type: string }
        sortOrder: { type: integer }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Customer:
      type: object
      required: [id, name, phone, createdAt, status, activityCount, verificationStatus, isUrgent]
      properties:
        id: { type: integer }
        name: { type: string }
        phone: { type: string }
        description: { type: ["string", "null"] }
        nationalCode: { type: ["string", "null"] }
        birthDateJalali: { type: ["string", "null"], pattern: '^[0-9]{4}/[0-9]{2}/[0-9]{2}$' }
        postalCode: { type: ["string", "null"], pattern: '^[0-9]{10}$' }
        verificationStatus: { type: string, enum: [unverified, verified], default: unverified }
        isUrgent: { type: boolean, default: false }
        creditScore: { type: ["number", "null"] }
        creditRank: { type: ["string", "null"] }
        creditCheckedAt: { type: ["string", "null"] }
        createdAt: { type: string }
        salespersonId: { type: ["integer", "null"] }
        salespersonName: { type: ["string", "null"] }
        priority: { type: ["integer", "null"], minimum: 1, maximum: 3 }
        status:
          type: string
          enum: [in_progress, cancelled, completed]
          default: in_progress
        activityCount: { type: integer }
        lastActivityAt: { type: ["string", "null"] }
    CustomerDetail:
      allOf:
        - $ref: "#/components/schemas/Customer"
        - type: object
          required: [activity]
          properties:
            activity:
              type: array
              items:
                $ref: "#/components/schemas/CallLog"
    CreditCheckInitiateInput:
      type: object
      required: [nationalCode]
      properties:
        nationalCode: { type: string, minLength: 10, maxLength: 10 }
        mobileNumber: { type: string, minLength: 10, maxLength: 13 }
    CreditCheckOtpInput:
      type: object
      required: [otp]
      properties:
        otp: { type: string, minLength: 4, maxLength: 8 }
    CustomerCreditCheck:
      type: object
      required: [id, customerId, status, createdAt, updatedAt]
      properties:
        id: { type: integer }
        customerId: { type: integer }
        status: { type: string, enum: [awaiting_otp, processing, report_generated, failed] }
        nationalCode: { type: ["string", "null"] }
        providerReference: { type: ["string", "null"] }
        providerStatus: { type: ["string", "null"] }
        score: { type: ["number", "null"] }
        scoreLabel: { type: ["string", "null"] }
        summary: { type: ["string", "null"] }
        errorMessage: { type: ["string", "null"] }
        createdAt: { type: string }
        updatedAt: { type: string }
        completedAt: { type: ["string", "null"] }
    CustomerInput:
      type: object
      required: [name, phone]
      properties:
        name: { type: string, minLength: 1 }
        phone: { type: string, minLength: 3 }
        description: { type: string }
        nationalCode: { type: ["string", "null"], minLength: 10, maxLength: 10 }
        birthDateJalali: { type: ["string", "null"], pattern: '^[0-9]{4}/[0-9]{2}/[0-9]{2}$' }
        postalCode: { type: ["string", "null"], pattern: '^[0-9]{10}$' }
        isUrgent: { type: boolean }
        salespersonId: { type: ["integer", "null"] }
        allocationProgramId: { type: ["integer", "null"] }
        priority: { type: ["integer", "null"], minimum: 1, maximum: 3 }
        status:
          type: string
          enum: [in_progress, cancelled, completed]
    CustomerTextParseInput:
      type: object
      required: [text]
      properties:
        text: { type: string, minLength: 3, maxLength: 5000 }
    CustomerTextParseResult:
      type: object
      required: [name, phone, description]
      properties:
        name: { type: string }
        phone: { type: string }
        description: { type: string }
    NotificationSettings:
      allOf:
        - $ref: "#/components/schemas/NotificationSettingsInput"
        - type: object
          required: [telegramBotTokenConfigured]
          properties:
            telegramBotTokenConfigured: { type: boolean }
    NotificationSettingsInput:
      type: object
      required: [ippanelEnabled, ippanelRelayUrl, ippanelFromNumber, ippanelPatternCode, telegramEnabled, telegramGroupChatId, telegramMessageTemplate]
      properties:
        ippanelEnabled: { type: boolean }
        ippanelRelayUrl: { type: string, format: uri, minLength: 8, maxLength: 500 }
        ippanelFromNumber: { type: string, minLength: 3, maxLength: 30 }
        ippanelPatternCode: { type: string, minLength: 3, maxLength: 100 }
        telegramEnabled: { type: boolean }
        telegramGroupChatId: { type: string, minLength: 2, maxLength: 100 }
        telegramMessageTemplate: { type: string, minLength: 10, maxLength: 4000 }
    NotificationDelivery:
      type: object
      required: [id, customerId, customerName, channel, status, createdAt]
      properties:
        id: { type: integer }
        customerId: { type: integer }
        customerName: { type: string }
        channel:
          type: string
          enum: [ippanel, telegram]
        status:
          type: string
          enum: [sent, failed, not_configured, invalid_recipient]
        errorMessage: { type: ["string", "null"] }
        createdAt: { type: string }
    CustomerUpdate:
      type: object
      properties:
