          type: boolean
          description: True for applications created under the draft-first workflow; false for legacy applications.
        initialContractRetained:
          type: boolean
          description: True when initial provider approval retained the already-signed primary contract because both principal and installment count were unchanged.
        planSnapshot: { type: ["object", "null"], additionalProperties: true }
        primaryManualValues: { type: object, additionalProperties: { type: string } }
        primaryManualVariables:
          type: array
          items:
            type: object
            required: [variable, label]
            properties:
              variable: { type: string }
              label: { type: string }
        conditionSnapshot: { type: ["object", "null"], additionalProperties: true }
        currentPrimaryGenerationId: { type: ["integer", "null"] }
        tomanReplacementEligibility:
          oneOf:
            - { $ref: "#/components/schemas/TomanReplacementEligibility" }
            - { type: "null" }
        tomanReplacement:
          oneOf:
            - { $ref: "#/components/schemas/TomanReplacementState" }
            - { type: "null" }
        primaryContractStatus: { type: ["string", "null"] }
        actionRequired: { type: boolean }
        actionRole: { type: string }
        businessStatus:
          type: string
          enum: [waiting_sales, waiting_registration, waiting_funder_approval, waiting_wallet_charge, wallet_charged, canceled, completed]
        documents: { type: array, items: { type: object } }
        history: { type: array, items: { type: object } }
        guarantor: { type: ["object", "null"], additionalProperties: true }
        collateral: { type: array, items: { type: object } }
        physicalChecks: { type: array, items: { type: object } }
        physicalDocuments: { type: array, items: { $ref: "#/components/schemas/PhysicalLoanDocument" } }
        funderDefects: { type: array, items: { type: object } }
        funderDecision: { type: ["string", "null"] }
        funderReason: { type: ["string", "null"] }
        initialProviderDecision:
          type: ["object", "null"]
          properties:
            decision: { type: string, enum: [approved, rejected] }
            decidedAt: { type: string, format: date-time }
            actorUserId: { type: ["integer", "null"] }
            reason: { type: ["string", "null"] }
        generatedDocuments:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              applicationId: { type: integer }
              kind: { type: string, enum: [primary, invoice, acknowledgement] }
              contractGenerationId: { type: ["integer", "null"] }
              current: { type: boolean }
              status: { type: ["string", "null"] }
              signed: { type: boolean }
              superseded: { type: boolean }
              supersededAt: { type: ["string", "null"], format: date-time }
              reviewReason: { type: ["string", "null"] }
              fileAvailable: { type: boolean }
              resendRepairRequired:
                type: boolean
                description: Current pending primary delivery reused a rejected upload; staff may explicitly prepare a guarded fresh-file retry.
              downloadUrl: { type: ["string", "null"] }
            additionalProperties: true
        calculation: { type: ["object", "null"], additionalProperties: true }
        updatedAt: { type: string }
