openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: crm
    description: CRM operations
paths:
  /goods-purchases/suggestions:
    $ref: './registration-suggestions.yaml#/paths/goods'
  /goods-purchases/{id}/documents/{kind}/signature-status:
    get:
      operationId: getGoodsPurchaseDocumentSignatureStatus
      summary: Read the current goods-document signature status
      description: Fetches a fresh provider-reported status for the latest document version without persisting it or changing purchase workflow state.
      tags: [goods-purchases]
      parameters:
        - { $ref: "#/components/parameters/GenericId" }
        - { name: kind, in: path, required: true, schema: { type: string, enum: [invoice, acknowledgement] } }
      responses:
        "200":
          description: Fresh provider-reported document status with no workflow mutation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GoodsDocumentSignatureStatus" }
  /payment-orders/suggestions:
    $ref: './registration-suggestions.yaml#/paths/payments'
  /social-monitor/reports:
    $ref: './social-monitor.yaml#/paths/reports'
  /social-monitor/customers:
    $ref: './social-monitor.yaml#/paths/customers'
  /social-monitor/threads/{threadId}/messages:
    $ref: './social-monitor.yaml#/paths/messages'
  /social-monitor/threads/{threadId}/customer:
    $ref: './social-monitor.yaml#/paths/customer'
  /social-monitor/threads/{threadId}/summary:
    $ref: './social-monitor.yaml#/paths/summary'
  /diagnostics/availability:
    $ref: './diagnostics.yaml#/paths/availability'
  /diagnostics/reports:
    $ref: './diagnostics.yaml#/paths/reports'
  /diagnostics/reports/active:
    $ref: './diagnostics.yaml#/paths/active'
  /diagnostics/reports/{id}:
    $ref: './diagnostics.yaml#/paths/report'
  /internal-chat/conversations:
    $ref: './internal-chat.yaml#/paths/conversations'
  /internal-chat/conversations/{conversationId}/messages:
    $ref: './internal-chat.yaml#/paths/messages'
  /internal-chat/conversations/{conversationId}/read:
    $ref: './internal-chat.yaml#/paths/read'
  /internal-chat/conversations/{conversationId}/typing:
    $ref: './internal-chat.yaml#/paths/typing'
  /internal-chat/messages/{messageId}:
    $ref: './internal-chat.yaml#/paths/message'
  /internal-chat/messages/{messageId}/reactions:
    $ref: './internal-chat.yaml#/paths/reactions'
  /internal-chat/messages/{messageId}/file:
    $ref: './internal-chat.yaml#/paths/file'
  /sales-reports:
    $ref: './sales-reports.yaml#/paths/report'
  /site-notifications:
    $ref: './site-notifications.yaml#/paths/notifications'
  /site-notifications/read-all:
    $ref: './site-notifications.yaml#/paths/readAll'
  /site-notifications/{id}/read:
    $ref: './site-notifications.yaml#/paths/read'
  /loan-applications/{id}/notes:
    $ref: './loan-case-notes.yaml#/paths/notes'
  /loan-applications/{id}/history:
    $ref: './loan-case-notes.yaml#/paths/history'
  /loan-applications/{id}/notes/{noteId}/file:
    $ref: './loan-case-notes.yaml#/paths/file'
  /mobile-calls/start:
    post:
      operationId: startMobileCall
      tags: [mobileCalls]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MobileCallStart" }
      responses:
        "200":
          description: Persisted call, idempotent by device and callId
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MobileCall" }
        "400": { description: Invalid call data }
        "401": { description: Invalid device token }
        "409": { description: Conflicting call data }
  /mobile-calls/end:
    post:
      operationId: endMobileCall
      tags: [mobileCalls]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MobileCallEnd" }
      responses:
        "200":
          description: Persisted even without notes or an open browser
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MobileCall" }
        "400": { description: Invalid call data or timing }
        "401": { description: Invalid device token }
        "409": { description: Conflicting call data }
  /mobile-calls:
    get:
      operationId: listMobileCalls
      tags: [mobileCalls]
      parameters:
        - { name: fromDate, in: query, schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' } }
        - { name: toDate, in: query, schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' } }
        - { name: direction, in: query, schema: { type: string, enum: [incoming, outgoing] } }
        - { name: expertUserId, in: query, schema: { type: integer, minimum: 1 } }
        - { name: search, in: query, schema: { type: string, maxLength: 200 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: Own calls for experts, all calls for admins, including without notes
          content:
            application/json:
              schema:
                type: object
                required: [items, total, totalDurationSeconds, incomingCount, outgoingCount]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/MobileCall" } }
                  total: { type: integer }
                  totalDurationSeconds: { type: integer }
                  incomingCount: { type: integer }
                  outgoingCount: { type: integer }
  /mobile-call-experts:
    get:
      operationId: listMobileCallExperts
      tags: [mobileCalls]
      responses:
        "200":
          description: Admin-only active experts
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, name]
                  properties:
                    id: { type: integer }
                    name: { type: string }
  /mobile-call-devices:
    get:
      operationId: listMobileCallDevices
      tags: [mobileCalls]
      responses:
        "200":
          description: Admin-only metadata, never stored tokens
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MobileCallDevice" }
    post:
      operationId: createMobileCallDevice
      tags: [mobileCalls]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MobileCallDeviceInput"
      responses:
        "201":
          description: Token displayed once, for secure storage on the phone
          content:
            application/json:
              schema:
                type: object
                required: [device, token]
                properties:
                  device: { $ref: "#/components/schemas/MobileCallDevice" }
                  token: { type: string }
  /mobile-call-devices/{id}:
    delete:
      operationId: revokeMobileCallDevice
      tags: [mobileCalls]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Token revoked, call history retained
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
  /accounting/funds:
    get:
      operationId: listAccountingFunds
      tags: [crm]
      responses:
        "200":
          description: Existing bank funds and their accounting balances in toman
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/AccountingFund" }
  /accounting/funds/{id}/opening:
    post:
      operationId: setAccountingOpening
      tags: [crm]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountingOpeningInput" }
      responses:
        "201":
          description: One-time opening entry; identical retries do not change the balance
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountingDocument" }
  /accounting/documents:
    get:
      operationId: listAccountingDocuments
      tags: [crm]
      parameters:
        - { name: fundId, in: query, schema: { type: integer, minimum: 1 } }
        - { name: from, in: query, description: Inclusive transaction date, schema: { type: string, format: date } }
        - { name: to, in: query, description: Inclusive transaction date, schema: { type: string, format: date } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, maximum: 100000 } }
      responses:
        "200":
          description: Immutable documents visible to the actor
          content:
            application/json:
              schema:
                type: object
                required: [items, total, page, limit]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/AccountingDocument" } }
                  total: { type: integer }
                  page: { type: integer }
                  limit: { type: integer }
    post:
      operationId: createAccountingDocument
      tags: [crm]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/AccountingDocumentInput" }
      responses:
        "201":
          description: Document, attachments and balance are committed atomically
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountingDocument" }
  /accounting/documents/{id}:
    get:
      operationId: getAccountingDocument
      tags: [crm]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Document including attachment metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountingDocument" }
  /accounting/documents/{id}/attachments:
    post:
      operationId: attachAccountingFiles
      tags: [crm]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/AccountingFilesInput" }
      responses:
        "200":
          description: Updated document; duplicate file uploads are deduplicated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountingDocument" }
  /accounting/documents/{id}/attachments/{attachmentId}:
    get:
      operationId: downloadAccountingAttachment
      tags: [crm]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
        - { name: attachmentId, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Authorized private attachment download
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
  /auth/login:
    post:
      operationId: login
      tags: [crm]
      summary: Sign in with a CRM username and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthLoginInput"
      responses:
        "200":
          description: Authenticated CRM session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
        "401": { description: Invalid credentials }
  /auth/logout:
    post:
      operationId: logout
      tags: [crm]
      summary: End the current CRM session
      responses:
        "204": { description: Session ended }
  /auth/session:
    get:
      operationId: getAuthSession
      tags: [crm]
      summary: Get the current CRM session
      responses:
        "200":
          description: Current authenticated session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
        "401": { description: Not authenticated }
  /auth/profile:
    patch:
      operationId: updateAuthProfile
      tags: [crm]
      summary: Update the current user's editable profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthProfileUpdate"
      responses:
        "200":
          description: Updated current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
        "401": { description: Not authenticated }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /crm/summary:
    get:
      operationId: getCrmSummary
      tags: [crm]
      summary: Get CRM dashboard summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CrmSummary"
  /notification-settings:
    get:
      operationId: getNotificationSettings
      tags: [crm]
      summary: Get admin notification settings
      responses:
        "200":
          description: Notification settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationSettings" }
    patch:
      operationId: updateNotificationSettings
      tags: [crm]
      summary: Update admin notification settings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationSettingsInput" }
      responses:
        "200":
          description: Updated notification settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationSettings" }
  /notification-deliveries:
    get:
      operationId: listNotificationDeliveries
      tags: [crm]
      summary: List recent notification delivery results for admins
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Recent notification delivery results
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/NotificationDelivery" }
  /database-backup:
    get:
      operationId: downloadDatabaseBackup
      tags: [crm]
      summary: Download a consistent SQLite database backup (admin only)
      responses:
        "200":
          description: SQLite backup file
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "403": { description: Admin access required }
  /database-restore:
    post:
      operationId: restoreDatabaseBackup
      tags: [crm]
      summary: Validate and stage a replacement SQLite database (admin only)
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "202":
          description: Database accepted and restart scheduled
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: { type: string }
        "400": { description: Invalid CRM database }
        "403": { description: Admin access required }
  /consult-options:
    get:
      operationId: listConsultOptions
      tags: [crm]
      summary: List active CRM dictionary options
      parameters:
        - name: fieldKey
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Active dictionary options
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ConsultOption" }
  /customers:
    get:
      operationId: listCustomers
      tags: [crm]
      summary: List customers
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: customerId
          in: query
          description: Exact customer database identifier
          schema:
            type: integer
            minimum: 1
        - name: status
          in: query
          schema:
            type: string
            enum: [in_progress, cancelled, completed]
        - name: priority
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 3
        - name: hasPriority
          in: query
          schema:
            type: boolean
        - name: salespersonId
          in: query
          schema:
            type: integer
        - name: dateFrom
          in: query
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
        - name: dateTo
          in: query
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
        - name: minCallCount
          in: query
          schema:
            type: integer
            minimum: 0
        - name: maxCallCount
          in: query
          schema:
            type: integer
            minimum: 0
        - name: sortBy
          in: query
          schema: { type: string, enum: [lastCallAt, boardTags] }
        - name: sortDirection
          in: query
          schema: { type: string, enum: [asc, desc], default: desc }
        - name: tag
          in: query
          description: Filter customers by an assigned tag
          schema: { type: string }
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Customer page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerPage"
    post:
      operationId: createCustomer
      tags: [crm]
      summary: Create a customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerInput"
      responses:
        "201":
          description: Created customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "409":
          description: An active customer has the same normalized mobile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DuplicateMobileConflict" }
  /customers/parse-text:
    post:
      operationId: parseCustomerText
      tags: [crm]
      summary: Extract customer fields from pasted free text
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerTextParseInput"
      responses:
        "200":
          description: Extracted customer fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerTextParseResult"
  /customers/phone-match:
    get:
      operationId: lookupCustomerByPhone
      tags: [crm]
      summary: Look up an active customer by exact normalized phone for duplicate prevention
      parameters:
        - name: phone
          in: query
          required: true
          schema: { type: string, minLength: 3 }
      responses:
        "200":
          description: Matching full customer profile, or null when no active exact match exists
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerPhoneMatch" }
        "403": { description: customers.create permission required }
  /customers/repeat-requests:
    post:
      operationId: createCustomerRepeatRequest
      tags: [crm]
      summary: Record a repeat request on the canonical customer without changing ownership or profile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerRepeatRequestInput" }
      responses:
        "201":
          description: Recorded repeat request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerRepeatRequest" }
        "404": { description: No active canonical customer has this normalized phone }
  /customer-tags:
    get:
      operationId: listCustomerTags
      tags: [crm]
      summary: List known customer tags
      responses:
        "200":
          description: Customer tag catalog
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CustomerTag" }
    post:
      operationId: createCustomerTag
      tags: [crm]
      summary: Add a custom customer tag
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerTagInput" }
      responses:
        "201":
          description: Created custom customer tag
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerTag" }
        "409": { description: A tag with the same canonical label already exists }
  /customers/{id}/tags:
    patch:
      operationId: updateCustomerTags
      tags: [crm]
      summary: Replace a customer's tags (repeat_request may only be removed by acknowledgement)
      parameters:
        - $ref: "#/components/parameters/CustomerId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerTagsInput" }
      responses:
        "200":
          description: Updated customer tags
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerTags" }
        "400": { description: Unknown tag or repeat_request removal requires acknowledgement }
        "404": { description: Customer not found or outside owner scope }
  /customers/{id}/repeat-requests:
    get:
      operationId: listCustomerRepeatRequests
      tags: [crm]
      summary: List pending and acknowledged repeat requests for the customer owner or admin
      parameters:
        - $ref: "#/components/parameters/CustomerId"
      responses:
        "200":
          description: Repeat-request history
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CustomerRepeatRequest" }
        "404": { description: Customer not found or outside owner scope }
  /customers/{id}/repeat-requests/acknowledge:
    post:
      operationId: acknowledgeCustomerRepeatRequests
      tags: [crm]
      summary: Acknowledge all pending repeat requests and clear their managed tag
      parameters:
        - $ref: "#/components/parameters/CustomerId"
      responses:
        "200":
          description: Pending requests acknowledged; safe when no requests are pending
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerRepeatRequestAcknowledgement" }
        "404": { description: Customer not found or outside owner scope }
  /customers/duplicates:
    get:
      operationId: listDuplicateCustomers
      tags: [crm]
      summary: List active customers sharing a normalized mobile or valid national code (admin only)
      responses:
        "200":
          description: Duplicate review groups and customer history counts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DuplicateCustomerGroup" }
        "403": { description: Admin access required }
  /customers/merge:
    post:
      operationId: mergeCustomers
      tags: [crm]
      summary: Archive a duplicate customer into the selected survivor and assign its salesperson (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerMergeInput" }
      responses:
        "200":
          description: Customers merged transactionally
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerMergeResult" }
        "400": { description: Invalid merge selection }
        "403": { description: Admin access required }
        "404": { description: Customer or salesperson not found }
        "409": { description: Customers are not identified as duplicates }
  /customers/{id}:
    get:
      operationId: getCustomer
      tags: [crm]
      summary: Get customer details
      parameters:
        - $ref: "#/components/parameters/CustomerId"
      responses:
        "200":
          description: Customer details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerDetail"
        "404":
          description: Customer not found
    delete:
      operationId: deleteCustomer
      tags: [crm]
      summary: Permanently delete a customer and related records
      parameters:
        - $ref: "#/components/parameters/CustomerId"
      responses:
        "204":
          description: Customer deleted
        "403":
          description: Admin access required
        "404":
          description: Customer not found
    patch:
      operationId: updateCustomer
      tags: [crm]
      summary: Update customer
      parameters:
        - $ref: "#/components/parameters/CustomerId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerUpdate"
      responses:
        "200":
          description: Updated customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "404":
          description: Customer not found
  /customers/{id}/verify:
    post:
      operationId: verifyCustomerIdentity
      tags: [crm]
      summary: Verify customer identity through SAPI.ir
      parameters:
        - $ref: "#/components/parameters/CustomerId"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerVerificationInput" }
      responses:
        "200":
          description: Verification attempt recorded; status and checks show any SAPI failures
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerVerificationResult"
        "400":
          description: Invalid national code, mobile, birth date, or postal code
        "409":
          description: Identity conflict or customer verification state changed during the provider request
        "502":
          description: Provider unavailable; failed attempt is persisted for manual review
  /customers/{id}/manual-verification-requests:
    post:
      operationId: createManualVerificationRequest
      tags: [crm]
      summary: Request manual review after a failed SAPI identity check
      parameters:
        - $ref: "#/components/parameters/CustomerId"
      responses:
        "201":
          description: Request created for the latest matching failed SAPI event; any stale pending request is superseded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManualVerificationRequest" }
        "200":
          description: Existing pending request for the same profile and source event returned idempotently
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManualVerificationRequest" }
        "400": { description: Customer has no eligible failed SAPI check }
        "404": { description: Customer not found or outside caller scope }
        "409": { description: Customer is already verified or identity/request changed concurrently }
  /manual-verifications:
    get:
      operationId: listManualVerificationRequests
      tags: [crm]
      summary: List manual identity-review requests (admin only)
      responses:
        "200":
          description: Manual identity-review requests
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ManualVerificationRequest" }
        "403": { description: Admin access required }
  /manual-verifications/{id}:
    get:
      operationId: getManualVerificationRequest
      tags: [crm]
      summary: Get a manual identity-review request and current profile (admin only)
      parameters:
        - $ref: "#/components/parameters/GenericId"
      responses:
        "200":
          description: Request, current customer profile, and four SAPI check statuses
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManualVerificationDetail" }
        "403": { description: Admin access required }
        "404": { description: Request not found }
  /manual-verifications/{id}/checks/{check}/decision:
    post:
      operationId: decideManualIdentityCheck
      tags: [crm]
      summary: Approve or reject only one failed identity check (admin only)
      parameters:
        - $ref: "#/components/parameters/GenericId"
        - name: check
          in: path
          required: true
          schema: { type: string, enum: [shahkarLite, personInfo, postalCodeInfo, sana] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdentityCheckDecisionInput"
      responses:
        "200":
          description: Updated request; customer becomes verified only when all checks pass
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManualVerificationDetail" }
        "400": { description: Invalid decision or reason }
        "403": { description: Admin access required }
        "409": { description: "Request or identity changed, or check already passed" }
  /manual-verifications/{id}/approve:
    post:
      operationId: approveManualVerificationRequest
      tags: [crm]
      summary: Approve a manual identity review (admin only)
      parameters:
        - $ref: "#/components/parameters/GenericId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ManualVerificationApproval" }
      responses:
        "200":
          description: Approved request and updated customer profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManualVerificationRequest" }
        "400": { description: Invalid corrections or incomplete review decisions }
        "403": { description: Admin access required }
        "404": { description: Request not found }
        "409": { description: "Request is stale, already resolved, or conflicts with another identity" }
